// ── Core helpers ──────────────────────────────────────────────────────────────
function escHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function syntaxHL(sql){
  const kw = /\b(SELECT|FROM|WHERE|JOIN|LEFT|RIGHT|INNER|OUTER|ON|AND|OR|NOT|IN|IS|NULL|ORDER|BY|GROUP|HAVING|LIMIT|OFFSET|WITH|AS|CASE|WHEN|THEN|ELSE|END|UNION|ALL|DISTINCT|INSERT|UPDATE|DELETE|CREATE|DROP|ALTER|TABLE|INDEX|VIEW|SET|VALUES|INTO|TRUNCATE|VACUUM|ANALYZE|EXPLAIN|BEGIN|COMMIT|ROLLBACK|COALESCE|NULLIF|ROUND|COUNT|SUM|AVG|MIN|MAX|NOW|EXTRACT|SPLIT_PART|ARRAY_TO_STRING|FORMAT|EXECUTE|FOR|LOOP|DECLARE|DO|RETURN|PERFORM|RAISE)\b/g;
  const fn = /\b(pg_stat_activity|pg_stat_replication|pg_stat_statements|pg_stat_user_tables|pg_stat_user_indexes|pg_stat_progress_vacuum|pg_stat_progress_analyze|pg_stat_progress_create_index|pg_stat_progress_cluster|pg_stat_progress_basebackup|pg_stat_progress_copy|pg_database|pg_class|pg_namespace|pg_index|pg_locks|pg_blocking_pids|pg_cancel_backend|pg_terminate_backend|pg_reload_conf|pg_stat_reset|pg_stat_statements_reset|pg_size_pretty|pg_database_size|pg_table_size|pg_indexes_size|pg_total_relation_size|pg_relation_size|pg_is_in_recovery|pg_last_wal_receive_lsn|pg_last_wal_replay_lsn|pg_last_xact_replay_timestamp|pg_wal_lsn_diff|pg_postmaster_start_time|pg_backend_pid|age)\b/gi;
  const str = /('[^']*')/g;
  const num = /\b(\d+(\.\d+)?)\b/g;
  const cmt = /(--[^\n]*)/g;
  return escHtml(sql)
    .replace(cmt, '<span class="c">$1</span>')
    .replace(kw, m => `<span class="k">${m}</span>`)
    .replace(fn, m => `<span class="f">${m}</span>`)
    .replace(str, '<span class="s">$1</span>')
    .replace(num, '<span class="s">$1</span>');
}

// ── localStorage: SQL edits ───────────────────────────────────────────────────
const LS_PREFIX = 'pgcs_sql_';
function savedSql(id){ try{ return localStorage.getItem(LS_PREFIX+id); }catch(e){ return null; } }
function saveSql(id,sql){ try{ localStorage.setItem(LS_PREFIX+id,sql); }catch(e){} }
function resetSql(id){ try{ localStorage.removeItem(LS_PREFIX+id); }catch(e){} }
function getEffectiveSql(item){ return savedSql(item.id)||item.sql; }
function isModified(id){ return savedSql(id)!==null; }

// ── renderCard (built-in) ─────────────────────────────────────────────────────
function renderCard(item){
  const modified = isModified(item.id);
  const effectiveSql = getEffectiveSql(item);
  const effectiveName = (typeof getEffectiveName === 'function') ? getEffectiveName(item) : item.name;
  const effectiveDesc = (typeof getEffectiveDesc === 'function') ? getEffectiveDesc(item) : item.desc;
  const effectiveCols = (typeof getEffectiveCols === 'function') ? getEffectiveCols(item) : (item.cols||[]);
  const badgeMap = {os:"ОС",repl:"Репликация",perf:"Производительность",lock:"Блокировки",vac:"VACUUM"};
  const badge = item.badge ? `<span class="badge b-${item.badge}">${badgeMap[item.badge]}</span>` : '';
  const modDot = modified ? `<span class="modified-dot" title="Изменено"></span>` : '';
  const cols = effectiveCols.map(c=>`
    <tr>
      <td class="col-n">${escHtml(c.n)}</td>
      <td class="col-d">${escHtml(c.d)}${c.note?`<span class="col-note">▸ ${escHtml(c.note)}</span>`:''}</td>
    </tr>`).join('');
  return `<div class="card" id="card-${item.id}">
    <div class="card-header" onclick="toggle('${item.id}')">
      <svg class="chevron" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="4,2 10,7 4,12"/></svg>
      <div class="card-meta">
        <div class="card-name">${escHtml(effectiveName)} ${badge}${modDot}</div>
        <div class="card-desc">${escHtml(effectiveDesc)}</div>
      </div>
    </div>
    <div class="card-body">
      <div class="code-wrap">
        <pre id="pre-${item.id}">${syntaxHL(effectiveSql)}</pre>
        <div style="position:absolute;top:8px;right:8px;display:flex;gap:6px;">
          <button class="edit-btn${modified?' active':''}" id="editbtn-${item.id}"
            onclick="openEditModal('${item.id}',event)">редактировать</button>
          <button class="copy-btn" id="copybtn-${item.id}"
            onclick="copyCode('${item.id}',event)">копировать</button>
        </div>
      </div>

      ${cols?`<div class="cols-label">Пояснения по колонкам</div><table class="cols-table"><tbody>${cols}</tbody></table>`:''}
    </div>
  </div>`;
}

// ── Edit actions ──────────────────────────────────────────────────────────────
function findItem(id){ return DATA.find(d=>d.id===id) || loadCustomCards().find(d=>d.id===id); }

function toggleEdit(id, e){
  e.stopPropagation();
  const wrap = document.getElementById('editor-'+id);
  const btn  = document.getElementById('editbtn-'+id);
  const ta   = document.getElementById('ta-'+id);
  if(!wrap.classList.contains('visible')){
    const item = findItem(id);
    ta.value = getEffectiveSql(item);
    wrap.classList.add('visible');
    btn.classList.add('active');
    btn.textContent = 'закрыть';
    ta.focus();
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight+4,600)+'px';
  } else { cancelEdit(id); }
}

function saveEdit(id){
  const ta  = document.getElementById('ta-'+id);
  const sql = ta.value.trim();
  if(!sql) return;
  saveSql(id, sql);
  document.getElementById('pre-'+id).innerHTML = syntaxHL(sql);
  const card = document.getElementById('card-'+id);
  if(!card.querySelector('.modified-dot')){
    const dot = document.createElement('span');
    dot.className = 'modified-dot'; dot.title = 'Запрос изменён';
    card.querySelector('.card-name').appendChild(dot);
  }
  const btn = document.getElementById('editbtn-'+id);
  btn.classList.add('active');
  document.getElementById('editor-'+id).classList.remove('visible');
  btn.textContent = 'сохранено ✓';
  btn.style.borderColor = 'var(--green)'; btn.style.color = 'var(--green)';
  setTimeout(()=>{ btn.textContent='редактировать'; btn.style.borderColor=''; btn.style.color=''; }, 1800);
}

function resetEdit(id){
  if(!confirm('Вернуть оригинальный запрос?')) return;
  resetSql(id);
  const item = findItem(id);
  document.getElementById('pre-'+id).innerHTML = syntaxHL(item.sql);
  document.getElementById('ta-'+id).value = item.sql;
  const card = document.getElementById('card-'+id);
  const dot = card.querySelector('.modified-dot');
  if(dot) dot.remove();
  const btn = document.getElementById('editbtn-'+id);
  btn.classList.remove('active');
  btn.textContent = 'редактировать';
  document.getElementById('editor-'+id).classList.remove('visible');
}

function cancelEdit(id){
  document.getElementById('editor-'+id).classList.remove('visible');
  const btn = document.getElementById('editbtn-'+id);
  if(!isModified(id)) btn.classList.remove('active');
  btn.textContent = 'редактировать';
}

// ── Copy ──────────────────────────────────────────────────────────────────────
function copyCode(id, e){
  e.stopPropagation();
  const allCards = [...DATA, ...loadCustomCards()];
  const item = allCards.find(d=>d.id===id);
  const sql = getEffectiveSql(item);
  navigator.clipboard.writeText(sql).catch(()=>{
    const ta = document.createElement('textarea');
    ta.value = sql; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
  });
  const btn = document.getElementById('copybtn-'+id);
  btn.textContent = 'скопировано ✓'; btn.classList.add('copied');
  setTimeout(()=>{ btn.textContent='копировать'; btn.classList.remove('copied'); }, 1800);
}

function toggle(id){
  document.getElementById('card-'+id).classList.toggle('open');
}

function navClick(id){
  const el = document.getElementById('card-'+id);
  if(el){
    el.scrollIntoView({behavior:'smooth',block:'start'});
    if(!el.classList.contains('open')) toggle(id);
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    event.currentTarget.classList.add('active');
  }
}

// ── Custom cards (localStorage) ───────────────────────────────────────────────
const LS_CUSTOM = 'pgcs_custom_cards';

function loadCustomCards() {
  try { return JSON.parse(localStorage.getItem(LS_CUSTOM) || '[]'); }
  catch(e) { return []; }
}
function saveCustomCards(arr) {
  try { localStorage.setItem(LS_CUSTOM, JSON.stringify(arr)); } catch(e) {}
}
function getCustomCards() { return loadCustomCards(); }

// Inject custom cards into DATA dynamically
function buildDataWithCustom() {
  const custom = loadCustomCards();
  if (!custom.length) return DATA;
  // Group custom cards by section
  const bySec = {};
  custom.forEach(c => {
    if (!bySec[c.section]) bySec[c.section] = [];
    bySec[c.section].push(c);
  });
  // Build merged array: after each matching section insert custom cards
  const merged = [];
  const sections = DATA.filter(d => d.section).map(d => d.section);
  let i = 0;
  while (i < DATA.length) {
    const item = DATA[i];
    merged.push(item);
    if (item.section && bySec[item.section]) {
      // Find end of this section
      let j = i + 1;
      while (j < DATA.length && !DATA[j].section) j++;
      // Insert custom cards at end of section (before next section)
      bySec[item.section].forEach(c => merged.splice(j + merged.length - DATA.length - 1 + bySec[item.section].indexOf(c), 0, c));
      // Actually simpler: collect all items of this section, append custom at end
    }
    i++;
  }
  return merged;
}

// Simpler approach: append custom cards to their section inline during render
function getCustomForSection(sectionName) {
  return loadCustomCards().filter(c => c.section === sectionName);
}

const LS_NAME = 'pgcs_name_';

const LS_COLS = 'pgcs_cols_';
function savedOverride(prefix,id){ try{ return localStorage.getItem(prefix+id); }catch(e){ return null; } }

function resetOverride(prefix,id){ try{ localStorage.removeItem(prefix+id); }catch(e){} }

// ── Add card modal ────────────────────────────────────────────────────────────
let editingCardId = null;
let editingIsBuiltin = false;
let colCount = 1;
let selectedSection = null;

function openEditModal(id, e){
  if(e) e.stopPropagation();
  editingCardId = id || null;
  editingIsBuiltin = false;

  var item = null;
  if(id){
    var allCards = DATA.concat(loadCustomCards());
    item = allCards.filter(function(d){ return d.id === id; })[0] || null;
    if(item && !item.custom) editingIsBuiltin = true;
  }

  document.getElementById('modal-title').textContent = id ? '\u270f Редактировать запрос' : '+ Новый запрос';
  document.getElementById('modal-save-btn').textContent = id ? 'Сохранить' : 'Сохранить';

  var nameVal = item ? (savedOverride(LS_NAME, id) || item.name) : '';
  var descVal = item ? (savedOverride(LS_DESC, id) || item.desc || '') : '';
  var sqlVal  = item ? (savedSql(id) || item.sql) : '';

  document.getElementById('m-name').value = nameVal;
  document.getElementById('m-desc').value = descVal;
  document.getElementById('m-sql').value  = sqlVal;

  var resetBtn = document.getElementById('modal-reset-btn');
  if(resetBtn) resetBtn.style.display = editingIsBuiltin ? 'inline-block' : 'none';

  // Build section chips
  var chipsEl = document.getElementById('section-chips');
  selectedSection = item ? (item.section || null) : null;
  chipsEl.innerHTML = getSections().map(function(s){
    return '<div class="s-chip" data-section="'+escHtml(s.section)+'" data-dot="'+s.dot+'" data-color="'+s.color+'">'
      +'<span class="s-chip-dot" style="background:'+s.dot+'"></span>'+escHtml(s.section)+'</div>';
  }).join('');
  chipsEl.querySelectorAll('.s-chip').forEach(function(chip){
    chip.addEventListener('click', function(){
      selectedSection = chip.dataset.section;
      chipsEl.querySelectorAll('.s-chip').forEach(function(c){ c.classList.remove('sel'); c.style.borderColor=''; c.style.background='var(--bg3)'; });
      chip.classList.add('sel');
      chip.style.borderColor = chip.dataset.dot;
      chip.style.background  = chip.dataset.color;
    });
  });
  if(selectedSection){
    var activeChip = chipsEl.querySelector('[data-section="'+escHtml(selectedSection)+'"]');
    if(activeChip) activeChip.click();
  }

  // Build cols editor
  var ce = document.getElementById('cols-editor');
  ce.innerHTML = '';
  colCount = 0;
  var cols = [];
  if(item){
    var savedCols = savedOverride(LS_COLS, id);
    cols = savedCols ? JSON.parse(savedCols) : (item.cols || []);
  }
  if(cols.length > 0){
    cols.forEach(function(c){ addColWithValues(c.n||'', c.d||''); });
  } else {
    addColWithValues('','');
  }

  document.getElementById('modal-overlay').classList.add('visible');
  setTimeout(function(){ document.getElementById('m-name').focus(); }, 80);
}

function openAddModal(){
  editingCardId = null; editingIsBuiltin = false;
  openEditModal(null);
}

function closeModal(){ document.getElementById('modal-overlay').classList.remove('visible'); editingCardId=null; }
function overlayClick(e){ if(e.target===document.getElementById('modal-overlay')) closeModal(); }

function addCol(){ addColWithValues('',''); }
function addColWithValues(name,desc){
  const ce=document.getElementById('cols-editor');
  const id=colCount++;
  const row=document.createElement('div');
  row.className='col-edit-row'; row.id='col-row-'+id;
  row.innerHTML='<input placeholder="имя_колонки" value="'+escHtml(name)+'"/><textarea placeholder="Что означает эта колонка..." rows="2">'+escHtml(desc)+'</textarea><button class="col-del" onclick="delCol('+id+')">&#x2715;</button>';
  ce.appendChild(row);
}
function delCol(id){ const row=document.getElementById('col-row-'+id); if(row) row.remove(); }
function readCols(){
  const rows=document.querySelectorAll('#cols-editor .col-edit-row');
  const cols=[];
  rows.forEach(row=>{
    const inp=row.querySelector('input');
    const ta=row.querySelector('textarea');
    const n=(inp?inp.value.trim():'');
    const d=(ta?ta.value.trim():'');
    if(n||d) cols.push({n,d});
  });
  return cols;
}

function saveCard(){
  const name=document.getElementById('m-name').value.trim();
  const desc=document.getElementById('m-desc').value.trim();
  const sql=document.getElementById('m-sql').value.trim();
  if(!selectedSection){ alert('Выбери раздел'); return; }
  if(!name){ alert('Введи название'); document.getElementById('m-name').focus(); return; }
  if(!sql){ alert('Введи SQL запрос'); document.getElementById('m-sql').focus(); return; }
  const cols=readCols();
  if(editingCardId && editingIsBuiltin){
    const orig=DATA.find(d=>d.id===editingCardId);
    if(orig){
      if(name!==orig.name) saveOverride(LS_NAME,editingCardId,name); else resetOverride(LS_NAME,editingCardId);
      if(desc!==orig.desc) saveOverride(LS_DESC,editingCardId,desc); else resetOverride(LS_DESC,editingCardId);
      if(sql!==orig.sql) saveSql(editingCardId,sql); else resetSql(editingCardId);
      if(JSON.stringify(cols)!==JSON.stringify(orig.cols||[])) saveOverride(LS_COLS,editingCardId,JSON.stringify(cols)); else resetOverride(LS_COLS,editingCardId);
    }
    closeModal(); render(document.getElementById('search').value); return;
  }
  const cards=loadCustomCards();
  if(editingCardId && !editingIsBuiltin){
    const idx=cards.findIndex(c=>c.id===editingCardId);
    if(idx>=0) cards[idx]={...cards[idx],name,desc,sql,cols,section:selectedSection};
  } else {
    cards.push({id:'custom_'+Date.now(),name,desc,sql,cols,section:selectedSection,custom:true});
  }
  saveCustomCards(cards); closeModal();
  render(document.getElementById('search').value);
  setTimeout(()=>{ const el=document.getElementById('sec-'+selectedSection.replace(/\s+/g,'-')); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); },100);
}

function resetBuiltinCard(){
  if(!editingCardId) return;
  if(!confirm('Вернуть оригинальные название, описание, SQL и колонки?')) return;
  resetSql(editingCardId);
  resetOverride(LS_NAME,editingCardId); resetOverride(LS_DESC,editingCardId); resetOverride(LS_COLS,editingCardId);
  closeModal(); render(document.getElementById('search').value);
}

function deleteCustomCard(id,e){
  e.stopPropagation();
  if(!confirm('Удалить этот запрос?')) return;
  saveCustomCards(loadCustomCards().filter(c=>c.id!==id));
  resetSql(id); render(document.getElementById('search').value);
}

function saveGroup(){

  saveCustomSections(groups);
  document.getElementById('gm-name').value='';
  renderGroupsList();
  render(document.getElementById('search').value);
}
function deleteGroup(name){
  const cards=loadCustomCards().filter(c=>c.section===name);
  if(cards.length>0){if(!confirm('В группе "'+name+'" есть '+cards.length+' запрос(ов). Удалить всё?'))return;saveCustomCards(loadCustomCards().filter(c=>c.section!==name));}
  saveCustomSections(getCustomSections().filter(g=>g.name!==name));
  renderGroupsList();
  render(document.getElementById('search').value);
}
function renderGroupsList(){
  var groups=getCustomSections();
  var el=document.getElementById('gm-existing');
  if(!groups.length){
    el.innerHTML='<div style="color:var(--text3);font-size:12px;padding:6px 0;">Нет пользовательских групп</div>';
    return;
  }
  el.innerHTML='';
  groups.forEach(function(g){
    var cnt=loadCustomCards().filter(function(c){return c.section===g.name;}).length;
    var row=document.createElement('div');
    row.style.cssText='display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border)';
    var icon=document.createElement('span');
    icon.style.fontSize='16px'; icon.textContent=g.icon;
    var lbl=document.createElement('span');
    lbl.style.cssText='flex:1;font-size:12px;color:var(--text)'; lbl.textContent=g.name;
    var cnt_el=document.createElement('span');
    cnt_el.style.cssText='font-size:11px;color:var(--text3)'; cnt_el.textContent=cnt+' запр.';
    var btn=document.createElement('button');
    btn.className='group-del-btn'; btn.textContent='удалить';
    (function(name){ btn.addEventListener('click', function(){ deleteGroup(name); }); })(g.name);
    row.appendChild(icon); row.appendChild(lbl); row.appendChild(cnt_el); row.appendChild(btn);
    el.appendChild(row);
  });
}

// Override render to include custom sections
function renderCustomCard(item){
  var effectiveSql = (typeof savedSql==='function' && savedSql(item.id)) || item.sql;
  var cols=(item.cols||[]).filter(function(c){return c.n||c.d;}).map(function(c){
    return '<tr><td class="col-n">'+escHtml(c.n)+'</td><td class="col-d">'+escHtml(c.d)+'</td></tr>';
  }).join('');
  var id = item.id;
  return '<div class="card" id="card-'+id+'" style="border-color:var(--green-border)">'
    +'<div class="card-header" onclick="toggle(\''+id+'\')">'
    +'<svg class="chevron" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="4,2 10,7 4,12"/></svg>'
    +'<div class="card-meta">'
    +'<div class="card-name">'+escHtml(item.name)
    +' <span style="font-size:10px;padding:1px 7px;border-radius:10px;background:var(--green-bg);color:var(--green);border:1px solid var(--green-border);font-family:var(--mono)">мой</span></div>'
    +'<div class="card-desc">'+escHtml(item.desc||'')+'</div>'
    +'</div></div>'
    +'<div class="card-body">'
    +'<div class="code-wrap">'
    +'<pre id="pre-'+id+'">'+syntaxHL(effectiveSql)+'</pre>'
    +'<div style="position:absolute;top:8px;right:8px;display:flex;gap:6px;">'
    +'<button class="edit-btn" onclick="openEditModal(\''+id+'\');event.stopPropagation()">редактировать</button>'
    +'<button class="copy-btn" id="copybtn-'+id+'" onclick="copyCode(\''+id+'\',event)">копировать</button>'
    +'<button class="del-card-btn" onclick="deleteCustomCard(\''+id+'\',event)">удалить</button>'
    +'</div></div>'
    +(cols ? '<div class="cols-label">Пояснения по колонкам</div><table class="cols-table"><tbody>'+cols+'</tbody></table>' : '')
    +'</div></div>';
}


function render(filter){
  const content=document.getElementById('content');
  const navLinks=document.getElementById('nav-links');
  const q=(filter||'').toLowerCase().trim();
  const customCards=loadCustomCards();
  let html='',sectionCount=0,cardCount=0,curSection=null,curSectionCards='',curSectionCount=0;
  function flushSection(){
    if(!curSection||curSectionCount===0)return;
    sectionCount++;
    html+='<div class="section-header" id="sec-'+curSection.id+'"><div class="section-icon" style="background:'+curSection.color+'">'+curSection.icon+'</div><div class="section-title-text">'+curSection.name+'</div><div class="section-count">'+curSectionCount+' скриптов</div></div>'+curSectionCards;
  }
  const allSectionItems=[...DATA,...getCustomSections().map(s=>({section:s.name,icon:s.icon,color:s.color,dot:s.dot,custom:true}))];
  allSectionItems.forEach(item=>{
    if(item.section){
      if(curSection){const cc=customCards.filter(c=>c.section===curSection.name);cc.forEach(c=>{const hay=(c.name+c.desc+c.sql+(c.cols||[]).map(x=>x.n+x.d).join(' ')).toLowerCase();if(!q||hay.includes(q)){curSectionCards+=renderCustomCard(c);curSectionCount++;cardCount++;}});}
      flushSection();
      curSection={name:item.section,icon:item.icon,color:item.color,dot:item.dot,id:item.section.replace(/\s+/g,'-')};
      curSectionCards='';curSectionCount=0;return;
    }
    if(q){const hay=(item.name+item.desc+item.sql+(item.cols||[]).map(c=>c.n+c.d).join(' ')).toLowerCase();if(!hay.includes(q))return;}
    curSectionCards+=renderCard(item);curSectionCount++;cardCount++;
  });
  if(curSection){const cc=customCards.filter(c=>c.section===curSection.name);cc.forEach(c=>{const hay=(c.name+c.desc+c.sql+(c.cols||[]).map(x=>x.n+x.d).join(' ')).toLowerCase();if(!q||hay.includes(q)){curSectionCards+=renderCustomCard(c);curSectionCount++;cardCount++;}});}
  flushSection();
  content.innerHTML=html||'<div class="empty">Ничего не найдено</div>';
  let nHtml='',nSection=null;
  [...DATA,...getCustomSections().map(s=>({section:s.name,icon:s.icon,color:s.color,dot:s.dot,custom:true}))].forEach(item=>{
    if(item.section){nSection=item;nHtml+='<div class="nav-section">'+(item.custom?'<span style="color:var(--green);font-size:10px">★ </span>':'')+item.section+'</div>';const cc=customCards.filter(c=>c.section===item.section);cc.forEach(c=>{if(q){const hay=(c.name+c.desc+c.sql+(c.cols||[]).map(x=>x.n+x.d).join(' ')).toLowerCase();if(!hay.includes(q))return;}nHtml+='<a class="nav-item" href="#card-'+c.id+'" onclick="navClick(\''+c.id+'\')"><span class="nav-dot" style="background:'+(nSection?nSection.dot:'#8b949e')+'"></span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--green)">'+c.name+'</span></a>';});return;}
    if(q){const hay=(item.name+item.desc+item.sql+(item.cols||[]).map(c=>c.n+c.d).join(' ')).toLowerCase();if(!hay.includes(q))return;}
    const mod=isModified(item.id)?' style="color:var(--orange)"':'';
    nHtml+='<a class="nav-item" href="#card-'+item.id+'" onclick="navClick(\''+item.id+'\')"><span class="nav-dot" style="background:'+(nSection?nSection.dot:'#8b949e')+'"></span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"'+mod+'>'+item.name+'</span></a>';
  });
  navLinks.innerHTML=nHtml;
  document.getElementById('stat-visible').textContent=cardCount;
  document.getElementById('stat-sections').textContent=sectionCount;
}

// ── Save to File ──────────────────────────────────────────────────────────────
function saveToFile(){
  var customCards    = loadCustomCards();
  var customSections = getCustomSections();
  var sqlEdits={}, nameEdits={}, descEdits={}, colsEdits={};
  try {
    for(var i=0;i<localStorage.length;i++){
      var key=localStorage.key(i); if(!key) continue;
      if(key.startsWith('pgcs_sql_'))  sqlEdits[key.replace('pgcs_sql_','')]   =localStorage.getItem(key);
      if(key.startsWith('pgcs_name_')) nameEdits[key.replace('pgcs_name_','')]  =localStorage.getItem(key);
      if(key.startsWith('pgcs_desc_')) descEdits[key.replace('pgcs_desc_','')]  =localStorage.getItem(key);
      if(key.startsWith('pgcs_cols_')) colsEdits[key.replace('pgcs_cols_','')]  =localStorage.getItem(key);
    }
  } catch(e){}

  var hasData = customCards.length>0 || customSections.length>0
    || Object.keys(sqlEdits).length>0 || Object.keys(nameEdits).length>0;
  if(!hasData){
    alert('Нет кастомных данных для сохранения.\nДобавь карточки или отредактируй запросы.');
    return;
  }

  var injectData = {
    v:3,
    custom_cards:    customCards,
    custom_sections: customSections,
    sql_edits:   sqlEdits,
    name_edits:  nameEdits,
    desc_edits:  descEdits,
    cols_edits:  colsEdits
  };

  fetch(window.location.href)
    .then(function(r){ return r.text(); })
    .then(function(html){
      // Remove old injected block
      html = html.replace(/<script id="pg-saved-data">[\s\S]*?<\/script>\s*/g, '');

      // Build restore script that runs synchronously before render()
      // Uses localStorage so render() picks up the data immediately
      var restoreCode =
        'var _pgd='+JSON.stringify(injectData)+';' +
        '(function(){' +
          'try{' +
            // sections
            'var es=JSON.parse(localStorage.getItem("pgcs_custom_sections")||"[]");' +
            'var en=es.map(function(s){return s.name;});' +
            '_pgd.custom_sections.forEach(function(s){if(en.indexOf(s.name)===-1){es.push(s);}});' +
            'localStorage.setItem("pgcs_custom_sections",JSON.stringify(es));' +
            // cards
            'var ec=JSON.parse(localStorage.getItem("pgcs_custom_cards")||"[]");' +
            'var ei=ec.map(function(c){return c.id;});' +
            '_pgd.custom_cards.forEach(function(c){if(ei.indexOf(c.id)===-1){ec.push(c);}});' +
            'localStorage.setItem("pgcs_custom_cards",JSON.stringify(ec));' +
            // edits - only set if not already locally overridden
            'Object.keys(_pgd.sql_edits).forEach(function(id){if(!localStorage.getItem("pgcs_sql_"+id))localStorage.setItem("pgcs_sql_"+id,_pgd.sql_edits[id]);});' +
            'Object.keys(_pgd.name_edits).forEach(function(id){if(!localStorage.getItem("pgcs_name_"+id))localStorage.setItem("pgcs_name_"+id,_pgd.name_edits[id]);});' +
            'Object.keys(_pgd.desc_edits).forEach(function(id){if(!localStorage.getItem("pgcs_desc_"+id))localStorage.setItem("pgcs_desc_"+id,_pgd.desc_edits[id]);});' +
            'Object.keys(_pgd.cols_edits).forEach(function(id){if(!localStorage.getItem("pgcs_cols_"+id))localStorage.setItem("pgcs_cols_"+id,_pgd.cols_edits[id]);});' +
          '}catch(e){console.error("pg-restore:",e);}' +
        '})();';

      // Inject BEFORE the main <script> tag so data is in localStorage before render() runs
      var injectBlock = '<script id="pg-saved-data">' + restoreCode + '<\/script>\n';
      html = html.replace('<script>\nconst DATA', injectBlock + '<script>\nconst DATA');

      var blob = new Blob([html], {type:'text/html;charset=utf-8'});
      var url  = URL.createObjectURL(blob);
      var a    = document.createElement('a');
      a.href=url; a.download='pg_dba_cheatsheet.html';
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      var msg='✓ Файл сохранён: pg_dba_cheatsheet.html\n\nВшито:\n';
      if(customSections.length) msg+='  • '+customSections.length+' групп\n';
      if(customCards.length)    msg+='  • '+customCards.length+' кастомных запросов\n';
      var ec2=Object.keys(sqlEdits).length+Object.keys(nameEdits).length;
      if(ec2) msg+='  • '+ec2+' изменений встроенных запросов\n';
      msg+='\nЗалей на GitHub как index.html — и везде будут твои карточки.';
      alert(msg);
    })
    .catch(function(err){
      alert('Ошибка: '+err.message+'\n\nОткрой читшит через GitHub Pages, не через file://');
    });
}


// ── Export / Import ───────────────────────────────────────────────────────────
function exportData(){
  var data = {
    version: 3,
    exported_at: new Date().toISOString(),
    custom_cards: loadCustomCards(),
    custom_sections: getCustomSections(),
    sql_edits: {},
    name_edits: {},
    desc_edits: {},
    cols_edits: {}
  };
  // Collect all localStorage edits for built-in cards
  try {
    for(var i=0; i<localStorage.length; i++){
      var key = localStorage.key(i);
      if(key && key.startsWith('pgcs_sql_'))  data.sql_edits[key.replace('pgcs_sql_','')]  = localStorage.getItem(key);
      if(key && key.startsWith('pgcs_name_')) data.name_edits[key.replace('pgcs_name_','')] = localStorage.getItem(key);
      if(key && key.startsWith('pgcs_desc_')) data.desc_edits[key.replace('pgcs_desc_','')] = localStorage.getItem(key);
      if(key && key.startsWith('pgcs_cols_')) data.cols_edits[key.replace('pgcs_cols_','')] = localStorage.getItem(key);
    }
  } catch(e){}

  var totalCards = data.custom_cards.length;
  var totalSections = data.custom_sections.length;
  var totalEdits = Object.keys(data.sql_edits).length + Object.keys(data.name_edits).length;

  if(totalCards === 0 && totalSections === 0 && totalEdits === 0){
    alert('Нечего экспортировать — нет кастомных запросов, групп или изменений.');
    return;
  }

  var json = JSON.stringify(data, null, 2);
  var blob = new Blob([json], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'pg_cheatsheet_backup_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  var msg = 'Экспортировано:\n';
  if(totalSections > 0) msg += '  • ' + totalSections + ' групп\n';
  if(totalCards > 0)    msg += '  • ' + totalCards + ' кастомных запросов\n';
  if(totalEdits > 0)    msg += '  • ' + totalEdits + ' изменений встроенных запросов\n';
  alert(msg);
}

function importData(event){
  var file = event.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try {
      var data = JSON.parse(e.target.result);
      if(!data.version || data.version < 3){
        alert('Файл создан старой версией читшита. Импорт не поддерживается.');
        return;
      }

      var msg = 'Будет импортировано:\n';
      if(data.custom_sections && data.custom_sections.length) msg += '  • ' + data.custom_sections.length + ' групп\n';
      if(data.custom_cards && data.custom_cards.length)       msg += '  • ' + data.custom_cards.length + ' кастомных запросов\n';
      var editCount = Object.keys(data.sql_edits||{}).length + Object.keys(data.name_edits||{}).length;
      if(editCount > 0) msg += '  • ' + editCount + ' изменений встроенных запросов\n';
      msg += '\nТекущие данные будут объединены (не перезаписаны).\nПродолжить?';

      if(!confirm(msg)) return;

      // Merge sections (skip duplicates by name)
      if(data.custom_sections && data.custom_sections.length){
        var existing = getCustomSections();
        var existingNames = existing.map(function(s){ return s.name; });
        var toAdd = data.custom_sections.filter(function(s){ return existingNames.indexOf(s.name) === -1; });
        saveCustomSections(existing.concat(toAdd));
      }

      // Merge cards (skip duplicates by id)
      if(data.custom_cards && data.custom_cards.length){
        var existingCards = loadCustomCards();
        var existingIds = existingCards.map(function(c){ return c.id; });
        var cardsToAdd = data.custom_cards.filter(function(c){ return existingIds.indexOf(c.id) === -1; });
        saveCustomCards(existingCards.concat(cardsToAdd));
      }

      // Restore SQL edits
      try {
        if(data.sql_edits)  Object.keys(data.sql_edits).forEach(function(id){ localStorage.setItem('pgcs_sql_'+id,  data.sql_edits[id]);  });
        if(data.name_edits) Object.keys(data.name_edits).forEach(function(id){ localStorage.setItem('pgcs_name_'+id, data.name_edits[id]); });
        if(data.desc_edits) Object.keys(data.desc_edits).forEach(function(id){ localStorage.setItem('pgcs_desc_'+id, data.desc_edits[id]); });
        if(data.cols_edits) Object.keys(data.cols_edits).forEach(function(id){ localStorage.setItem('pgcs_cols_'+id, data.cols_edits[id]); });
      } catch(err){}

      render(document.getElementById('search').value);
      alert('Импорт завершён успешно!');
    } catch(err){
      alert('Ошибка чтения файла: ' + err.message);
    }
    // Reset input so same file can be imported again if needed
    event.target.value = '';
  };
  reader.readAsText(file);
}

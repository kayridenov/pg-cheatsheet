<script>
const DATA = [

// ═══════════════════════════════════════════════
// СОСТОЯНИЕ СЕРВЕРА
// ═══════════════════════════════════════════════
{section:"Состояние сервера", icon:"🖥", color:"#1f3050", dot:"#58a6ff"},

{id:"uptime", name:"Аптайм и версия PostgreSQL", badge:"",
desc:"Время работы без перезапуска. Первое что смотрят после инцидента.",
sql:`SELECT now() - pg_postmaster_start_time() AS uptime, pg_postmaster_start_time() AS started_at, version() AS pg_version;`,
cols:[
  {n:"uptime", d:"Интервал с момента старта. После аварийного рестарта будет маленьким."},
  {n:"started_at", d:"Точная дата и время старта — сравни с временем инцидента."},
  {n:"pg_version", d:"Полная строка версии PostgreSQL. Нужна при обращении в поддержку."}
]},

{id:"pg_settings_nondefault", name:"Параметры, изменённые относительно дефолтных", badge:"",
desc:"Быстрый аудит конфигурации — все параметры которые отличаются от значений по умолчанию.",
sql:`SELECT name, setting, unit, boot_val AS default_value, source, sourcefile, sourceline, pending_restart FROM pg_settings WHERE source NOT IN ('default','override') ORDER BY source, name;`,
cols:[
  {n:"setting", d:"Текущее значение параметра."},
  {n:"default_value", d:"Значение по умолчанию — для сравнения с текущим."},
  {n:"source", d:"Откуда взято значение: configuration-file, environment-variable, command-line и т.д."},
  {n:"pending_restart", d:"true — изменение применится только после рестарта сервера.", note:"Применить без рестарта: SELECT pg_reload_conf();"}
]},

{id:"params_pending_restart", name:"Параметры, ожидающие рестарта", badge:"",
desc:"Только те настройки, которые уже изменены в конфиге, но ещё не вступили в силу.",
sql:`SELECT name, setting AS new_value, unit, short_desc, sourcefile, sourceline FROM pg_settings WHERE pending_restart = true;`,
cols:[
  {n:"name", d:"Имя параметра (напр. max_connections, shared_buffers)."},
  {n:"new_value", d:"Значение которое применится после рестарта PostgreSQL."},
  {n:"sourcefile / sourceline", d:"Где именно в конфиге задан параметр."}
]},

{id:"conn_max_check", name:"Использование пула соединений (% от max)", badge:"",
desc:"Сколько процентов max_connections уже занято — быстрый healthcheck.",
sql:`SELECT max_conn, used, res_for_super, max_conn - used - res_for_super AS available, round(100.0 * used / max_conn, 1) AS used_pct FROM (SELECT (SELECT setting::int FROM pg_settings WHERE name='max_connections') AS max_conn, (SELECT setting::int FROM pg_settings WHERE name='superuser_reserved_connections') AS res_for_super, count(*) AS used FROM pg_stat_activity) t;`,
cols:[
  {n:"max_conn", d:"Максимально допустимое число соединений (max_connections)."},
  {n:"used", d:"Текущее число открытых соединений всех типов."},
  {n:"res_for_super", d:"Слоты зарезервированные для суперюзера."},
  {n:"available", d:"Реально доступных слотов для обычных пользователей."},
  {n:"used_pct", d:"Процент заполнения. > 80% — срочно нужен пулер или увеличение лимита.", note:"При > 200 соединениях без пулера CPU тратится на переключение контекста. Используй PgBouncer."}
]},

{id:"conn_by_db_state", name:"Подключения по базам и состояниям", badge:"",
desc:"Сводка соединений с группировкой по БД и состоянию. Сравнивай с max_connections.",
sql:`SELECT datname, state, count(*) AS connections, count(*) FILTER (WHERE wait_event_type='Lock') AS waiting_lock, count(*) FILTER (WHERE wait_event_type='IO') AS waiting_io FROM pg_stat_activity WHERE datname IS NOT NULL GROUP BY datname, state ORDER BY connections DESC;`,
cols:[
  {n:"state", d:"active — запрос выполняется; idle — простой; idle in transaction — транзакция открыта без запроса (опасно!)."},
  {n:"connections", d:"Количество сессий в данном состоянии."},
  {n:"waiting_lock", d:"Сессии ожидающие снятия блокировки. > 0 — активные конфликты.", note:"SELECT current_setting('max_connections');"}
]},

{id:"conn_by_app", name:"Подключения по приложениям", badge:"",
desc:"Кто подключён, сколько соединений от каждого приложения и в каком состоянии.",
sql:`SELECT application_name, usename, datname, state, count(*) AS connections, count(*) FILTER (WHERE wait_event_type='Lock') AS lock_waits, min(now()-backend_start) AS oldest_conn FROM pg_stat_activity WHERE pid <> pg_backend_pid() AND application_name IS NOT NULL GROUP BY application_name, usename, datname, state ORDER BY connections DESC LIMIT 30;`,
cols:[
  {n:"application_name", d:"Имя приложения передаётся клиентом. Пустое = приложение не установило имя."},
  {n:"oldest_conn", d:"Самое старое соединение от этого приложения — помогает найти утечки.", note:"Установить имя: SET application_name = 'my_app'; или в строке подключения: application_name=my_app"}
]},

{id:"wal_stat", name:"Статистика WAL (PG 14+)", badge:"",
desc:"Объём WAL, количество записей и синхронизаций. Помогает оценить нагрузку на запись.",
sql:`-- PG 14-16 (wal_write/wal_sync removed in PG 17)
SELECT wal_records, wal_fpi, wal_bytes, pg_size_pretty(wal_bytes) AS wal_size_pretty, wal_buffers_full, stats_reset FROM pg_stat_wal;

-- PG 17+ (columns renamed/removed):
SELECT wal_records, wal_fpi, wal_bytes, pg_size_pretty(wal_bytes) AS wal_size_pretty, wal_buffers_full, stats_reset FROM pg_stat_wal;`,
cols:[
  {n:"wal_bytes", d:"Суммарный объём сгенерированных WAL-данных с момента сброса статистики."},
  {n:"wal_fpi", d:"Full page images — записи полных страниц после checkpoint. Много = частые checkpoints или большой random_page_cost."},
  {n:"wal_buffers_full", d:"Сколько раз WAL-буферы были заполнены и пришлось сбрасывать на диск вне плана.", note:"Доступно с PostgreSQL 14."}
]},

{id:"wal_archiver", name:"Статус архивирования WAL", badge:"",
desc:"Мониторинг архивирования WAL — провалы архивации приводят к накоплению файлов и заполнению диска.",
sql:`SELECT archived_count, last_archived_wal, last_archived_time, failed_count, last_failed_wal, last_failed_time, now() - last_archived_time AS time_since_last_archive, stats_reset FROM pg_stat_archiver;`,
cols:[
  {n:"archived_count", d:"Количество успешно заархивированных WAL файлов."},
  {n:"failed_count", d:"Количество неудачных попыток архивации. > 0 = проблема с archive_command."},
  {n:"last_failed_wal", d:"Имя последнего файла который не удалось заархивировать."},
  {n:"time_since_last_archive", d:"Время с последней успешной архивации. Большое значение = архивация остановилась.", note:"При failed_count > 0: проверь archive_command в postgresql.conf и права доступа к папке архива."}
]},

// ═══════════════════════════════════════════════
// БЫСТРАЯ ДИАГНОСТИКА
// ═══════════════════════════════════════════════
{section:"Быстрая диагностика", icon:"🔬", color:"#1a0a2e", dot:"#f778ba"},

{id:"session_summary", name:"Общая сводка по сессиям (дашборд)", badge:"",
desc:"Один запрос — полная картина состояния сервера прямо сейчас.",
sql:`SELECT state, count(*) AS total, count(*) FILTER (WHERE wait_event_type='Lock') AS lock_waits, count(*) FILTER (WHERE wait_event_type='IO') AS io_waits, count(*) FILTER (WHERE wait_event_type='LWLock') AS lwlock_waits, count(*) FILTER (WHERE now()-xact_start > interval '1 min') AS long_xacts, count(*) FILTER (WHERE now()-xact_start > interval '5 min') AS very_long_xacts, min(now()-xact_start) AS oldest_xact FROM pg_stat_activity WHERE pid <> pg_backend_pid() AND state IS NOT NULL GROUP BY state ORDER BY total DESC;`,
cols:[
  {n:"lock_waits / io_waits", d:"Сессии ждущие блокировки или диска. Норма — несколько, плохо — много."},
  {n:"very_long_xacts", d:"Транзакции живущие > 5 минут. > 0 — стоит разобраться."},
  {n:"oldest_xact", d:"Возраст самой старой транзакции. Большой — проверь top5_long_xact."}
]},

{id:"top5_active", name:"Топ-10 самых долгих активных запросов", badge:"lock",
desc:"Первое что смотреть при жалобах на тормоза — какие запросы выполняются дольше всего прямо сейчас.",
sql:`SELECT pid, usename, datname, client_addr, now()-query_start AS duration, wait_event_type, wait_event, left(query,120) AS query FROM pg_stat_activity WHERE state='active' AND pid <> pg_backend_pid() ORDER BY query_start ASC LIMIT 10;`,
cols:[
  {n:"duration", d:"Время выполнения текущего запроса. Растёт — запрос завис или ждёт."},
  {n:"wait_event_type / wait_event", d:"Lock = ждёт блокировку. IO = ждёт диск. NULL = реально работает на CPU.", note:"Для детального анализа: EXPLAIN (ANALYZE, BUFFERS) <query>;"}
]},

{id:"top5_idle_txn", name:"Топ-10 самых старых idle in transaction", badge:"lock",
desc:"Транзакции открытые без активного запроса — удерживают локи и мешают VACUUM.",
sql:`SELECT pid, usename, datname, client_addr, now()-xact_start AS xact_age, now()-state_change AS idle_since, left(query,120) AS last_query FROM pg_stat_activity WHERE state='idle in transaction' ORDER BY xact_start ASC NULLS LAST LIMIT 10;`,
cols:[
  {n:"xact_age", d:"Возраст транзакции с момента BEGIN. Именно это время она держит локи."},
  {n:"idle_since", d:"Как давно последний запрос в транзакции завершился.", note:"Завершить: SELECT pg_terminate_backend(pid);"}
]},

{id:"top5_waiting", name:"Топ-10 запросов в ожидании блокировки", badge:"lock",
desc:"Запросы которые прямо сейчас ждут снятия чужой блокировки.",
sql:`SELECT a.pid, a.usename, a.datname, now()-a.query_start AS waiting_duration, a.wait_event_type, a.wait_event, left(a.query,100) AS waiting_query, pg_blocking_pids(a.pid) AS blocked_by FROM pg_stat_activity a WHERE a.wait_event_type='Lock' AND a.state='active' AND a.pid <> pg_backend_pid() ORDER BY a.query_start ASC LIMIT 10;`,
cols:[
  {n:"waiting_duration", d:"Как долго запрос ждёт блокировку."},
  {n:"wait_event", d:"relation = ждёт таблицу; tuple = ждёт строку; transactionid = ждёт завершения транзакции."},
  {n:"blocked_by", d:"PID(ы) процессов-виновников.", note:"SELECT pg_terminate_backend(<pid из blocked_by>);"}
]},

{id:"top5_long_xact", name:"Топ-10 самых старых транзакций (любое состояние)", badge:"",
desc:"Старейшие транзакции — мешают VACUUM, накапливают bloat, удерживают XID.",
sql:`SELECT pid, usename, datname, client_addr, state, now()-xact_start AS xact_age, now()-query_start AS query_age, left(query,100) AS query FROM pg_stat_activity WHERE xact_start IS NOT NULL AND pid <> pg_backend_pid() ORDER BY xact_start ASC LIMIT 10;`,
cols:[
  {n:"xact_age", d:"Полное время жизни транзакции. Старые транзакции — главная причина bloat."},
  {n:"state", d:"active = выполняет запрос; idle in transaction = ждёт следующий запрос.", note:"Если xact_age > 1 часа — почти всегда проблема."}
]},

{id:"top5_temp_files", name:"Топ-10 запросов, пишущих временные файлы", badge:"perf",
desc:"Запросы которым не хватило work_mem и они сбрасывают данные на диск. Медленно.",
sql:`SELECT pid, usename, datname, now()-query_start AS duration, left(query,100) AS query FROM pg_stat_activity WHERE state='active' AND pid <> pg_backend_pid() ORDER BY query_start ASC LIMIT 10;

-- Для temp_files/temp_bytes используй pg_stat_statements:
SELECT queryid, calls, temp_blks_written, round(total_exec_time::numeric,1) AS total_ms, left(query,100) AS query FROM pg_stat_statements WHERE temp_blks_written > 0 ORDER BY temp_blks_written DESC LIMIT 10;`,
cols:[
  {n:"temp_files", d:"Количество временных файлов созданных запросом."},
  {n:"temp_size", d:"Размер временных файлов. Большой = work_mem сильно мал для этого запроса.", note:"Для сессии: SET work_mem = '256MB'; — временно увеличить только для текущей сессии."}
]},

{id:"activity_full", name:"Все активные запросы и зависшие транзакции", badge:"lock",
desc:"Главный запрос оперативного мониторинга: всё что выполняется или застряло в транзакции. Data Egret style.",
sql:`SELECT (clock_timestamp()-xact_start)::interval(0) AS xact_age, (clock_timestamp()-query_start)::interval(0) AS query_age, (clock_timestamp()-state_change)::interval(0) AS change_age, pid, state, datname, usename, coalesce(wait_event_type='Lock', false) AS waiting, wait_event_type||'.'||wait_event AS wait_details, client_addr||':'||client_port AS client, left(query,100) AS query FROM pg_stat_activity WHERE clock_timestamp()-coalesce(xact_start,query_start) > '00:00:00.1'::interval AND pid <> pg_backend_pid() AND state <> 'idle' ORDER BY coalesce(xact_start,query_start);`,
cols:[
  {n:"xact_age", d:"Возраст транзакции — самый важный показатель для VACUUM и bloat."},
  {n:"query_age", d:"Возраст текущего запроса."},
  {n:"change_age", d:"Время с последней смены состояния."},
  {n:"wait_details", d:"Тип и событие ожидания в формате тип.событие. '-' = не ждёт.", note:"Минимальный порог 0.1 сек отфильтровывает мгновенные транзакции."}
]},

// ═══════════════════════════════════════════════
// БЛОКИРОВКИ
// ═══════════════════════════════════════════════
{section:"Блокировки", icon:"🔒", color:"#2d0d0d", dot:"#f85149"},

{id:"blocking_graph", name:"Граф блокировок: кто кого блокирует (PG 9.6+)", badge:"lock",
desc:"Полная цепочка блокировок — виновник и жертва в одном запросе. Используй pg_blocking_pids.",
sql:`SELECT blocked.pid AS blocked_pid, blocked.usename AS blocked_user, now()-blocked.query_start AS wait_duration, left(blocked.query,80) AS blocked_query, blocking.pid AS blocking_pid, blocking.usename AS blocking_user, blocking.state AS blocking_state, left(blocking.query,80) AS blocking_query FROM pg_stat_activity AS blocked JOIN pg_stat_activity AS blocking ON blocking.pid = ANY(pg_blocking_pids(blocked.pid)) WHERE cardinality(pg_blocking_pids(blocked.pid)) > 0 ORDER BY wait_duration DESC;`,
cols:[
  {n:"blocked_pid", d:"PID процесса-жертвы."},
  {n:"wait_duration", d:"Как долго жертва уже ждёт. Растёт — ситуация не разрешается сама."},
  {n:"blocking_pid", d:"PID виновника — его нужно завершить или дождаться COMMIT/ROLLBACK."},
  {n:"blocking_state", d:"idle = забытая открытая транзакция, можно безопасно завершить.", note:"SELECT pg_terminate_backend(blocking_pid);"}
]},

{id:"locks_detail", name:"Все активные блокировки с деталями объекта", badge:"lock",
desc:"Полная таблица блокировок: что именно заблокировано, режим, выдано ли, возраст.",
sql:`SELECT a.datname, l.relation::regclass AS locked_object, l.transactionid, l.mode, l.granted, a.usename, left(a.query,60) AS query, a.query_start, age(now(),a.query_start) AS age, a.pid FROM pg_stat_activity a JOIN pg_locks l ON l.pid=a.pid ORDER BY a.query_start;`,
cols:[
  {n:"locked_object", d:"Имя таблицы (relation::regclass) или NULL для транзакционных блокировок."},
  {n:"mode", d:"Режим блокировки. AccessExclusive (ALTER TABLE, DROP) конфликтует со всем."},
  {n:"granted", d:"true = блокировка выдана. false = ожидает получения блокировки.", note:"Таблица совместимости режимов: https://www.postgresql.org/docs/current/explicit-locking.html"}
]},

{id:"locks_not_granted", name:"Только неполученные блокировки (что именно ждёт)", badge:"lock",
desc:"Список объектов которые прямо сейчас ожидаются — быстро найти что именно заблокировало систему.",
sql:`SELECT relation::regclass, locktype, mode, transactionid, pid FROM pg_locks WHERE NOT granted;`,
cols:[
  {n:"relation", d:"Таблица или индекс, на который ожидается блокировка. NULL = транзакционная блокировка."},
  {n:"locktype", d:"Тип: relation, tuple, transactionid, virtualxid, extend, advisory."},
  {n:"mode", d:"Запрошенный режим блокировки."},
  {n:"pid", d:"PID процесса который ждёт."}
]},

{id:"blocking_detail_legacy", name:"Детали блокировок: что именно заблокировано (PG < 9.6)", badge:"lock",
desc:"Расширенная информация о блокировках с именем объекта, режимами и длительностью у обеих сторон.",
sql:`SELECT COALESCE(l1.relation::regclass::text, l1.locktype) AS locked_item, w.wait_event_type AS waiting_ev_type, w.wait_event, left(w.query,60) AS waiting_query, l1.mode AS waiting_mode, now()-ws.xact_start AS waiting_xact_dur, now()-ws.query_start AS waiting_query_dur, w.pid AS waiting_pid, w.usename AS waiting_user, left(l.query,60) AS locking_query, l2.mode AS locking_mode, now()-ls.xact_start AS locking_xact_dur, l.pid AS locking_pid, l.usename AS locking_user, l.state AS locking_state FROM pg_stat_activity w JOIN pg_locks l1 ON w.pid=l1.pid AND NOT l1.granted JOIN pg_locks l2 ON (l1.transactionid=l2.transactionid AND l1.pid<>l2.pid) OR (l1.database=l2.database AND l1.relation=l2.relation AND l1.pid<>l2.pid) JOIN pg_stat_activity l ON l2.pid=l.pid JOIN pg_stat_activity ws ON ws.pid=w.pid JOIN pg_stat_activity ls ON ls.pid=l.pid WHERE w.wait_event IS NOT NULL AND w.wait_event_type IS NOT NULL ORDER BY l.query_start, w.query_start;`,
cols:[
  {n:"locked_item", d:"Что заблокировано: имя таблицы или тип локки (transactionid, virtualxid и др.)."},
  {n:"waiting_mode / locking_mode", d:"Режимы. AccessExclusive (ALTER TABLE, DROP) конфликтует со всем."},
  {n:"locking_state", d:"idle = забытая транзакция, безопасно завершить. active = виновник ещё работает."}
]},

{id:"lock_tree", name:"Дерево блокировок с deadlock-цепочками (PG < 9.6)", badge:"lock",
desc:"Рекурсивный запрос: полное дерево ожиданий с ролями процессов. ROOT BLOCKER — кого завершать.",
sql:`WITH RECURSIVE l AS (SELECT pid, locktype, granted, array_position(ARRAY['AccessShare','RowShare','RowExclusive','ShareUpdateExclusive','Share','ShareRowExclusive','Exclusive','AccessExclusive'],left(mode,-4)) AS m, ROW(locktype,database,relation,page,tuple,virtualxid,transactionid,classid,objid,objsubid) AS obj FROM pg_locks), pairs AS (SELECT w.pid AS waiter, l.pid AS locker, l.obj, l.m FROM l w JOIN l ON NOT l.obj IS DISTINCT FROM w.obj AND l.locktype=w.locktype AND NOT l.pid=w.pid AND l.granted WHERE NOT w.granted AND NOT EXISTS (SELECT FROM l i WHERE i.pid=l.pid AND i.locktype=l.locktype AND NOT i.obj IS DISTINCT FROM l.obj AND i.m>l.m)), leads AS (SELECT locker, 1 AS lvl, count(*) AS q, ARRAY[locker] AS track, false AS cycle FROM pairs GROUP BY locker UNION ALL SELECT i.locker, leads.lvl+1, (SELECT count(*) FROM pairs q WHERE q.locker=i.locker), leads.track||i.locker, i.locker=ANY(leads.track) FROM pairs i, leads WHERE i.waiter=leads.locker AND NOT leads.cycle), tree AS (SELECT locker AS pid, locker AS dad, locker AS root, CASE WHEN cycle THEN track ELSE NULL::int[] END AS dl, NULL::record AS obj, 0 AS lvl, locker::text AS path, array_agg(locker) OVER () AS all_pids FROM leads o WHERE (cycle AND NOT EXISTS (SELECT FROM leads i WHERE i.locker=ANY(o.track) AND (i.lvl>o.lvl OR i.q<o.q))) OR (NOT cycle AND NOT EXISTS (SELECT FROM pairs WHERE waiter=o.locker) AND NOT EXISTS (SELECT FROM leads i WHERE i.locker=o.locker AND i.lvl<o.lvl)) UNION ALL SELECT w.waiter, tree.pid, tree.root, CASE WHEN w.waiter=ANY(tree.dl) THEN tree.dl ELSE NULL::int[] END, w.obj, tree.lvl+1, tree.path||'.'||w.waiter, tree.all_pids||array_agg(w.waiter) OVER () FROM tree JOIN pairs w ON tree.pid=w.locker AND NOT (w.waiter=ANY(tree.all_pids))) SELECT (clock_timestamp()-a.xact_start)::interval(0) AS xact_age, (clock_timestamp()-a.state_change)::interval(0) AS state_age, a.datname, a.usename, a.client_addr, tree.pid, replace(a.state,'idle in transaction','idletx') AS state, CASE WHEN tree.pid=ANY(tree.dl) THEN '!! DEADLOCK' WHEN tree.lvl=0 THEN 'ROOT BLOCKER' WHEN (SELECT count(*) FROM tree p WHERE p.path~('^'||tree.path) AND p.path<>tree.path)>0 THEN 'MID BLOCKER' ELSE 'VICTIM' END AS role, (SELECT count(*) FROM tree p WHERE p.path~('^'||tree.path) AND p.path<>tree.path) AS blocks_n, (CASE WHEN tree.pid=ANY(tree.dl) THEN '!> ' ELSE repeat(' . ',tree.lvl)||' ' END)||trim(left(regexp_replace(a.query,'\s+',' ','g'),100)) AS query FROM tree LEFT JOIN pairs w ON w.waiter=tree.pid AND w.locker=tree.dad JOIN pg_stat_activity a USING (pid) JOIN pg_stat_activity r ON r.pid=tree.root ORDER BY (now()-r.xact_start), tree.path;`,
cols:[
  {n:"xact_age", d:"Время жизни транзакции. У ROOT BLOCKER — самый старый."},
  {n:"role", d:"ROOT BLOCKER = главный виновник; MID BLOCKER = сам жертва, но блокирует других; VICTIM = конечная жертва; !! DEADLOCK = цикл."},
  {n:"blocks_n", d:"Сколько процессов заблокировано ниже по цепочке."},
  {n:"query", d:"Запрос с отступами по уровню. Завершать — ROOT BLOCKER.", note:"Deadlock PostgreSQL разрывает автоматически через deadlock_timeout (по умолчанию 1s)."}
]},

{id:"idle_txn", name:"Зависшие транзакции idle in transaction > 5 мин", badge:"lock",
desc:"Транзакции без активности — удерживают локи и мешают VACUUM.",
sql:`SELECT pid, usename, datname, client_addr, now()-state_change AS idle_duration, now()-xact_start AS xact_duration, left(query,120) AS last_query FROM pg_stat_activity WHERE state='idle in transaction' AND now()-state_change > INTERVAL '5 minutes' ORDER BY idle_duration DESC;`,
cols:[
  {n:"idle_duration", d:"Как долго нет запросов внутри открытой транзакции."},
  {n:"xact_duration", d:"Полное время транзакции с BEGIN — это и блокирует VACUUM.", note:"Убить все: SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE state='idle in transaction' AND now()-state_change > INTERVAL '10 minutes';"}
]},

{id:"terminate", name:"Шаблоны: завершение проблемных сессий ⚠ ОСТОРОЖНО", badge:"lock",
desc:"⚠ ВЫПОЛНЯТЬ ОСТОРОЖНО. Готовые команды для всех ситуаций — мягко отменить запрос или убить сессию.",
sql:`-- Мягко отменить запрос (транзакция откатится):
SELECT pg_cancel_backend(12345);

-- Принудительно завершить сессию:
SELECT pg_terminate_backend(12345);

-- Убить все idle in transaction > 10 мин:
SELECT count(pg_terminate_backend(pid)) FROM pg_stat_activity WHERE state='idle in transaction' AND now()-state_change > INTERVAL '10 minutes' AND pid <> pg_backend_pid();

-- Убить все соединения к конкретной БД:
SELECT count(pg_terminate_backend(pid)) FROM pg_stat_activity WHERE datname='mydb' AND pid <> pg_backend_pid();

-- Убить все соединения конкретного пользователя:
SELECT count(pg_terminate_backend(pid)) FROM pg_stat_activity WHERE usename='someuser' AND pid <> pg_backend_pid();

-- Отменить все запросы дольше 10 минут:
SELECT count(pg_cancel_backend(pid)) FROM pg_stat_activity WHERE state='active' AND now()-query_start > INTERVAL '10 minutes' AND pid <> pg_backend_pid();`,
cols:[
  {n:"pg_cancel_backend(pid)", d:"SIGINT — прерывает запрос, транзакция откатывается. Мягко и безопасно."},
  {n:"pg_terminate_backend(pid)", d:"SIGTERM — убивает сессию полностью. Если cancel не помогает."},
  {n:"count(...)", d:"Возвращает количество успешно обработанных сессий.", note:"true = сигнал доставлен. false = процесс уже завершился или нет прав."}
]},

// ═══════════════════════════════════════════════
// РЕПЛИКАЦИЯ
// ═══════════════════════════════════════════════
{section:"Репликация", icon:"🔄", color:"#0d2236", dot:"#79c0ff"},

{id:"repl_replica_status", name:"Статус репликации на реплике", badge:"repl",
desc:"LSN, лаг в секундах, синхронизация. Основной мониторинг standby — запускать на реплике.",
sql:`SELECT pg_is_in_recovery() AS is_replica, pg_last_wal_receive_lsn() AS receive_lsn, pg_last_wal_replay_lsn() AS replay_lsn, pg_last_wal_receive_lsn() = pg_last_wal_replay_lsn() AS is_synced, EXTRACT(EPOCH FROM now()) - EXTRACT(EPOCH FROM pg_last_xact_replay_timestamp()) AS lag_seconds, pg_last_xact_replay_timestamp() AS last_replay_at;`,
cols:[
  {n:"is_replica", d:"true = это standby. false = мастер, запрос не нужен."},
  {n:"receive_lsn", d:"Последняя LSN полученная из WAL-потока мастера."},
  {n:"replay_lsn", d:"Последняя LSN применённая к данным реплики."},
  {n:"lag_seconds", d:"Лаг в секундах. При простое мастера может расти без реального отставания.", note:"Байтовое отставание: SELECT pg_wal_lsn_diff(pg_last_wal_receive_lsn(), pg_last_wal_replay_lsn());"}
]},

{id:"repl_master_status", name:"Состояние всех реплик на мастере", badge:"repl",
desc:"Все подключённые реплики, их лаг на каждом этапе WAL-применения. Запускать на мастере.",
sql:`SELECT client_addr, application_name, state, sync_state, sent_lsn, write_lsn, flush_lsn, replay_lsn, write_lag, flush_lag, replay_lag, pg_wal_lsn_diff(pg_current_wal_lsn(), replay_lsn) AS total_lag_bytes, pg_size_pretty(pg_wal_lsn_diff(pg_current_wal_lsn(), replay_lsn)) AS total_lag_size FROM pg_stat_replication ORDER BY total_lag_bytes DESC NULLS LAST;`,
cols:[
  {n:"state", d:"streaming = нормальная работа; catchup = реплика догоняет мастер."},
  {n:"sync_state", d:"async = асинхронная; sync = синхронная; quorum = кворумная."},
  {n:"write_lag / flush_lag / replay_lag", d:"Лаг на каждом этапе: запись в WAL, fsync, применение к данным."},
  {n:"total_lag_bytes", d:"Полное байтовое отставание. > 100 MB при высокой нагрузке = риск потери данных.", note:"NULL в replay_lag при streaming = реплика синхронна."}
]},

{id:"repl_lag_detail", name:"Подробный лаг репликации по этапам", badge:"repl",
desc:"Байтовое отставание на каждом этапе WAL — send, write, flush, replay.",
sql:`SELECT client_addr, application_name, state, sync_state, pg_wal_lsn_diff(pg_current_wal_lsn(), sent_lsn) AS send_lag_bytes, pg_wal_lsn_diff(sent_lsn, write_lsn) AS write_lag_bytes, pg_wal_lsn_diff(write_lsn, flush_lsn) AS flush_lag_bytes, pg_wal_lsn_diff(flush_lsn, replay_lsn) AS replay_lag_bytes, pg_wal_lsn_diff(pg_current_wal_lsn(), replay_lsn) AS total_lag_bytes, pg_size_pretty(pg_wal_lsn_diff(pg_current_wal_lsn(), replay_lsn)) AS total_lag_size, write_lag, flush_lag, replay_lag FROM pg_stat_replication ORDER BY total_lag_bytes DESC NULLS LAST;`,
cols:[
  {n:"send_lag_bytes", d:"Данные ещё не отправлены реплике (на мастере)."},
  {n:"write_lag_bytes", d:"Отправлены, но не записаны в WAL реплики."},
  {n:"flush_lag_bytes", d:"Записаны, но не сброшены на диск (fsync не выполнен)."},
  {n:"replay_lag_bytes", d:"Сброшены на диск, но не применены к данным."},
  {n:"total_lag_size", d:"Полное байтовое отставание. > 100 MB = риск потери данных при failover.", note:"0 = реплика синхронна."}
]},

{id:"repl_slots", name:"Слоты репликации (мониторинг)", badge:"repl",
desc:"Зависший неактивный слот накапливает WAL и может исчерпать диск.",
sql:`SELECT slot_name, slot_type, database, active, active_pid, restart_lsn, confirmed_flush_lsn, pg_wal_lsn_diff(pg_current_wal_lsn(), restart_lsn) AS retained_bytes, pg_size_pretty(pg_wal_lsn_diff(pg_current_wal_lsn(), restart_lsn)) AS retained_size FROM pg_replication_slots ORDER BY retained_bytes DESC NULLS LAST;`,
cols:[
  {n:"active", d:"false = слот не используется. Зависший неактивный слот накапливает WAL."},
  {n:"retained_bytes", d:"Сколько WAL держится на диске из-за этого слота. > 1 GB — опасно.", note:"Удалить зависший слот: SELECT pg_drop_replication_slot('slot_name'); — делай осторожно, данные реплики потеряются."}
]},

{id:"repl_wal_receiver", name:"Статус WAL receiver на реплике (PG 9.6+)", badge:"repl",
desc:"Детали входящего WAL-потока на реплике — статус подключения к мастеру.",
sql:`SELECT status, receive_start_lsn, receive_start_tli, written_lsn, flushed_lsn, received_tli, last_msg_send_time, last_msg_receipt_time, latest_end_lsn, latest_end_time, sender_host, sender_port, conninfo FROM pg_stat_wal_receiver;`,
cols:[
  {n:"status", d:"streaming = нормально работает; stopping = останавливается; stopped = остановлен."},
  {n:"written_lsn / flushed_lsn", d:"LSN записанная и сброшенная на диск реплики."},
  {n:"last_msg_receipt_time", d:"Время последнего полученного сообщения от мастера. Давнее = проблемы с сетью.", note:"Доступно только на реплике (WHERE pg_is_in_recovery() = true)."}
]},

// ═══════════════════════════════════════════════
// ПРОИЗВОДИТЕЛЬНОСТЬ ЗАПРОСОВ
// ═══════════════════════════════════════════════
{section:"Производительность запросов", icon:"📊", color:"#0d2117", dot:"#3fb950"},

{id:"top_queries_time", name:"Топ-20 запросов по суммарному времени", badge:"perf",
desc:"Требует pg_stat_statements. Главный инструмент поиска самых дорогих запросов.",
sql:`SELECT queryid, round(total_exec_time::numeric,1) AS total_ms, calls, round(mean_exec_time::numeric,2) AS mean_ms, round(stddev_exec_time::numeric,2) AS stddev_ms, round((100*total_exec_time/NULLIF(sum(total_exec_time) OVER (),0))::numeric,1) AS pct_cpu, round(100.0*shared_blks_hit/NULLIF(shared_blks_hit+shared_blks_read,0),1) AS cache_hit_pct, temp_blks_written, rows, left(query,100) AS short_query FROM pg_stat_statements ORDER BY total_exec_time DESC LIMIT 20;`,
cols:[
  {n:"queryid", d:"Хеш запроса. Полный текст: SELECT query FROM pg_stat_statements WHERE queryid='...';"},
  {n:"total_ms", d:"Суммарное время выполнения (мс). Главный критерий — именно этот запрос нагружает CPU."},
  {n:"stddev_ms", d:"Стандартное отклонение. Высокое = нестабильный план или lock wait."},
  {n:"pct_cpu", d:"Доля в суммарном CPU всех запросов. > 20% = приоритет для оптимизации."},
  {n:"cache_hit_pct", d:"% попаданий в shared_buffers. < 90% = нужны индексы или больший кеш."},
  {n:"temp_blks_written", d:"Ненулевое = work_mem не хватает для сортировки/хеша.", note:"Сбросить статистику: SELECT pg_stat_statements_reset();"}
]},

{id:"top_queries_io", name:"Топ-20 запросов по физическому IO", badge:"perf",
desc:"Запросы с наибольшим числом физических чтений с диска — кандидаты на индексирование.",
sql:`SELECT queryid, calls, shared_blks_read, shared_blks_hit, round(100.0*shared_blks_hit/NULLIF(shared_blks_hit+shared_blks_read,0),1) AS cache_hit_pct, round(mean_exec_time::numeric,2) AS mean_exec_ms, left(query,100) AS short_query FROM pg_stat_statements WHERE shared_blks_read > 0 ORDER BY shared_blks_read DESC LIMIT 20;`,
cols:[
  {n:"shared_blks_read", d:"Блоков прочитано с диска (cache miss). Большое = нет индекса или мало shared_buffers."},
  {n:"cache_hit_pct", d:"Процент попаданий в кеш. < 90% при большом трафике — проблема.", note:"Включить IO timing: ALTER SYSTEM SET track_io_timing=on; SELECT pg_reload_conf();"}
]},

{id:"top_queries_rows", name:"Топ-20 запросов возвращающих больше всего строк", badge:"perf",
desc:"Запросы с аномально большим количеством обрабатываемых строк — возможно нет нужных условий WHERE.",
sql:`SELECT queryid, calls, rows, round(rows::numeric/NULLIF(calls,0),0) AS avg_rows_per_call, round(total_exec_time::numeric,1) AS total_ms, round(mean_exec_time::numeric,2) AS mean_ms, left(query,100) AS short_query FROM pg_stat_statements WHERE rows > 0 ORDER BY rows DESC LIMIT 20;`,
cols:[
  {n:"rows", d:"Суммарное число обработанных строк за всё время."},
  {n:"avg_rows_per_call", d:"Среднее строк за один вызов. Миллионы строк при простом запросе = нет WHERE или нет LIMIT."}
]},

{id:"unstable_plans", name:"Запросы с нестабильным временем (cv_pct)", badge:"perf",
desc:"Высокий cv_pct = нестабильный план, lock wait, или кеш-промахи. Непредсказуемое поведение.",
sql:`SELECT queryid, calls, round(mean_exec_time::numeric,2) AS mean_ms, round(stddev_exec_time::numeric,2) AS stddev_ms, round((stddev_exec_time/NULLIF(mean_exec_time,0)*100)::numeric,1) AS cv_pct, round(min_exec_time::numeric,2) AS min_ms, round(max_exec_time::numeric,2) AS max_ms, left(query,100) AS short_query FROM pg_stat_statements WHERE calls > 50 ORDER BY cv_pct DESC LIMIT 20;`,
cols:[
  {n:"cv_pct", d:"Коэффициент вариации (stddev/mean × 100%). > 50% = нестабильность. > 100% = патология."},
  {n:"min_ms / max_ms", d:"max/min > 10x при одном запросе = почти всегда lock wait или cache miss.", note:"EXPLAIN (ANALYZE, BUFFERS) в момент медленного выполнения."}
]},

{id:"top_queries_by_db", name:"Топ-5 дорогих запросов с привязкой к БД", badge:"perf",
desc:"Самые ресурсоёмкие запросы с именем базы данных — удобно для мультибазовых инстансов.",
sql:`SELECT d.datname, round(s.total_exec_time::numeric,2) AS total_exec_ms, s.calls, s.rows, round(s.total_exec_time::numeric/calls,2) AS avg_ms, round((100*s.total_exec_time/NULLIF(sum(s.total_exec_time::numeric) OVER (),0))::numeric,2) AS pct_cpu, substring(s.query,1,80) AS short_query FROM pg_stat_statements s JOIN pg_database d ON s.dbid=d.oid ORDER BY pct_cpu DESC LIMIT 10;`,
cols:[
  {n:"datname", d:"База данных в которой выполняется запрос."},
  {n:"pct_cpu", d:"Доля этого запроса в суммарном CPU всех запросов по всем базам."}
]},

{id:"seq_scans", name:"Таблицы с аномальным числом sequential scan", badge:"perf",
desc:"Большие таблицы с частыми seq scan без индексных — источник IO-нагрузки.",
sql:`SELECT schemaname, relname, seq_scan, idx_scan, seq_scan-idx_scan AS seq_over_idx, pg_size_pretty(pg_relation_size(relid)) AS table_size, n_live_tup AS live_rows, CASE WHEN idx_scan=0 THEN 'no index scans!' WHEN seq_scan>idx_scan*3 THEN 'possible missing index' ELSE 'ok' END AS verdict FROM pg_stat_user_tables WHERE n_live_tup > 10000 AND seq_scan > 100 ORDER BY seq_over_idx DESC LIMIT 30;`,
cols:[
  {n:"seq_scan", d:"Полных сканирований таблицы — дорого по IO для больших таблиц."},
  {n:"seq_over_idx", d:"Превышение seq над idx. Большое значение при большой таблице = нужен индекс."},
  {n:"verdict", d:"Автоматическая оценка.", note:"После добавления индекса сбросить счётчики: SELECT pg_stat_reset();"}
]},

{id:"missing_indexes", name:"Таблицы без индексов с высоким seq_scan", badge:"perf",
desc:"Кандидаты на создание индекса: много последовательных сканов, мало или ноль индексных.",
sql:`SELECT schemaname, relname AS table_name, seq_scan, seq_tup_read, idx_scan, idx_tup_fetch, pg_size_pretty(pg_relation_size(relid)) AS table_size, round(seq_tup_read::numeric/NULLIF(seq_scan,0)) AS avg_rows_per_seq FROM pg_stat_user_tables WHERE seq_scan > 0 AND (idx_scan=0 OR seq_scan>idx_scan*5) AND pg_relation_size(relid) > 1024*1024 ORDER BY seq_tup_read DESC LIMIT 20;`,
cols:[
  {n:"seq_tup_read", d:"Строк прочитано через sequential scan суммарно. Большое = серьёзная нагрузка."},
  {n:"avg_rows_per_seq", d:"Среднее строк за одно полное сканирование. Много = большая таблица, индекс очень нужен."}
]},

{id:"duplicate_indexes", name:"Дублирующиеся индексы", badge:"perf",
desc:"Индексы с одинаковыми колонками — дублируют данные, замедляют INSERT/UPDATE/DELETE.",
sql:`SELECT indrelid::regclass AS table_name, array_agg(indexrelid::regclass ORDER BY indexrelid) AS indexes, array_agg(pg_get_indexdef(indexrelid) ORDER BY indexrelid) AS index_defs, pg_size_pretty(sum(pg_relation_size(indexrelid))) AS total_size FROM pg_index GROUP BY indrelid, indkey HAVING count(*) > 1 ORDER BY sum(pg_relation_size(indexrelid)) DESC;`,
cols:[
  {n:"indexes", d:"Массив имён дублирующихся индексов."},
  {n:"index_defs", d:"Полные определения для сравнения."},
  {n:"total_size", d:"Суммарный размер дублей — сколько места можно освободить.", note:"Перед удалением: проверь уникальность, внешние ключи, использование в конкретных запросах."}
]},

{id:"fk_no_index", name:"Внешние ключи без индексов (риск lock)", badge:"perf",
desc:"FK без индекса = sequential scan при DELETE/UPDATE родителя + риск deadlock.",
sql:`SELECT c.conname AS fk_name, c.conrelid::regclass AS child_table, c.confrelid::regclass AS parent_table, a.attname AS fk_column FROM pg_constraint c JOIN pg_attribute a ON a.attrelid=c.conrelid AND a.attnum=ANY(c.conkey) WHERE c.contype='f' AND NOT EXISTS (SELECT FROM pg_index i WHERE i.indrelid=c.conrelid AND i.indkey::int[]@>c.conkey::int[]) ORDER BY c.conrelid::regclass::text;`,
cols:[
  {n:"fk_name", d:"Имя ограничения внешнего ключа."},
  {n:"child_table / parent_table", d:"Дочерняя и родительская таблицы."},
  {n:"fk_column", d:"Колонка внешнего ключа — именно на неё нужно создать индекс.", note:"CREATE INDEX CONCURRENTLY ON child_table(fk_column);"}
]},

{id:"unused_indexes", name:"Неиспользуемые индексы (idx_scan = 0)", badge:"perf",
desc:"Индексы которые ни разу не использовались — занимают место и тормозят DML.",
sql:`SELECT n.nspname AS schema_name, t.relname AS table_name, i.relname AS index_name, ix.indisunique AS is_unique, ix.indisprimary AS is_primary, s.idx_scan, pg_size_pretty(pg_relation_size(i.oid)) AS index_size, pg_relation_size(i.oid) AS size_bytes FROM pg_index ix JOIN pg_class t ON t.oid=ix.indrelid JOIN pg_class i ON i.oid=ix.indexrelid JOIN pg_namespace n ON n.oid=t.relnamespace LEFT JOIN pg_stat_user_indexes s ON s.indexrelid=i.oid WHERE n.nspname NOT IN ('pg_catalog','information_schema','pg_toast') ORDER BY s.idx_scan ASC NULLS FIRST, size_bytes DESC LIMIT 50;`,
cols:[
  {n:"is_unique / is_primary", d:"Уникальные и первичные индексы нельзя удалять даже при idx_scan=0."},
  {n:"idx_scan", d:"0 = индекс не использовался с последнего сброса статистики."},
  {n:"index_size", d:"Неиспользуемый индекс > 100 MB = явный кандидат на удаление.", note:"Перед удалением убедись что статистика репрезентативна (> 1 недели рабочей нагрузки)."}
]},

{id:"index_stats_full", name:"Полная статистика использования индексов", badge:"perf",
desc:"Сканирования, чтения, fetch для каждого индекса — полная картина эффективности.",
sql:`SELECT n.nspname AS schema_name, t.relname AS table_name, i.relname AS index_name, ix.indisunique AS is_unique, s.idx_scan, s.idx_tup_read, s.idx_tup_fetch, pg_size_pretty(pg_relation_size(i.oid)) AS index_size, ts.seq_scan AS table_seq_scans, ts.idx_scan AS table_idx_scans FROM pg_index ix JOIN pg_class t ON t.oid=ix.indrelid JOIN pg_class i ON i.oid=ix.indexrelid JOIN pg_namespace n ON n.oid=t.relnamespace LEFT JOIN pg_stat_user_indexes s ON s.indexrelid=i.oid LEFT JOIN pg_stat_user_tables ts ON ts.relid=ix.indrelid WHERE n.nspname NOT IN ('pg_catalog','information_schema') ORDER BY s.idx_scan DESC NULLS LAST LIMIT 50;`,
cols:[
  {n:"idx_tup_read", d:"Строк индекса прочитано при сканированиях."},
  {n:"idx_tup_fetch", d:"Живых строк таблицы получено через индекс. Намного меньше idx_tup_read = много мёртвых кортежей."}
]},

{id:"explain_template", name:"EXPLAIN ANALYZE — правильный шаблон", badge:"perf",
desc:"Полная диагностика плана: IO, буферы, реальные строки. Обязателен при расследовании тормозов.",
sql:`EXPLAIN (ANALYZE, VERBOSE, BUFFERS, FORMAT TEXT) /* сюда вставить запрос */;

-- Для UPDATE/DELETE обязательно оборачивать:
BEGIN;
  EXPLAIN (ANALYZE, BUFFERS) UPDATE ... ;
ROLLBACK;`,
cols:[
  {n:"ANALYZE", d:"Реально выполняет запрос. Без него — только теоретический план."},
  {n:"BUFFERS", d:"Показывает shared hit (кеш) и read (диск). Главный показатель эффективности."},
  {n:"Actual Rows vs Rows", d:"Фактические vs оценочные строки. Расхождение > 10x = устаревшая статистика = нужен ANALYZE."},
  {n:"shared read", d:"Данные читались с диска. Много read = нет индекса или плохой план.", note:"ВАЖНО: ANALYZE реально выполняет запрос! UPDATE/DELETE — только в BEGIN...ROLLBACK!"}
]},

// ═══════════════════════════════════════════════
// VACUUM И BLOAT
// ═══════════════════════════════════════════════
{section:"VACUUM и Bloat", icon:"🧹", color:"#1a0d2e", dot:"#bc8cff"},

{id:"dead_tuples", name:"Таблицы с наибольшим числом мёртвых кортежей", badge:"vac",
desc:"Dead tuples занимают место и замедляют запросы. Приоритеты для VACUUM.",
sql:`SELECT schemaname, relname AS table_name, n_dead_tup AS dead_tuples, n_live_tup AS live_tuples, round(100.0*n_dead_tup/NULLIF(n_live_tup+n_dead_tup,0),1) AS dead_pct, pg_size_pretty(pg_table_size(relid)) AS table_size, last_vacuum, last_autovacuum, last_analyze, last_autoanalyze FROM pg_stat_user_tables WHERE n_dead_tup > 1000 ORDER BY dead_pct DESC, n_dead_tup DESC LIMIT 30;`,
cols:[
  {n:"dead_pct", d:"Доля мёртвых строк. > 20% = запускай VACUUM ANALYZE вручную."},
  {n:"last_autovacuum", d:"NULL = autovacuum никогда не запускался на этой таблице."},
  {n:"last_analyze", d:"Без свежей статистики планировщик строит плохие планы.", note:"Запустить вручную: VACUUM (ANALYZE, VERBOSE) tablename;"}
]},

{id:"autovac_needed", name:"Ожидается ли запуск autovacuum", badge:"vac",
desc:"Превысила ли таблица порог для autovacuum. VACUUM NEEDED = нужен немедленно.",
sql:`WITH rel_set AS (SELECT oid, NULLIF(split_part(split_part(array_to_string(reloptions,','),'autovacuum_vacuum_threshold=',2),',',1),'')::BIGINT AS rel_thr, NULLIF(split_part(split_part(array_to_string(reloptions,','),'autovacuum_vacuum_scale_factor=',2),',',1),'')::NUMERIC AS rel_scale FROM pg_class) SELECT n.nspname AS schema_name, c.relname, s.n_dead_tup, round(COALESCE(rs.rel_thr,current_setting('autovacuum_vacuum_threshold')::BIGINT)+COALESCE(rs.rel_scale,current_setting('autovacuum_vacuum_scale_factor')::NUMERIC)*c.reltuples) AS trigger_at, to_char(s.last_autovacuum,'YYYY-MM-DD HH24:MI') AS last_autovac, CASE WHEN COALESCE(rs.rel_thr,current_setting('autovacuum_vacuum_threshold')::BIGINT)+COALESCE(rs.rel_scale,current_setting('autovacuum_vacuum_scale_factor')::NUMERIC)*c.reltuples < s.n_dead_tup THEN 'VACUUM NEEDED' ELSE 'ok' END AS status FROM pg_stat_user_tables s JOIN pg_class c ON s.relid=c.oid JOIN rel_set rs ON s.relid=rs.oid JOIN pg_namespace n ON c.relnamespace=n.oid ORDER BY s.n_dead_tup DESC LIMIT 40;`,
cols:[
  {n:"trigger_at", d:"Порог: при превышении autovacuum должен запуститься."},
  {n:"status", d:"VACUUM NEEDED = таблица ждёт autovacuum. Долго висит = проверь autovacuum_max_workers.", note:"Сколько autovacuum воркеров сейчас: SELECT count(*) FROM pg_stat_activity WHERE query LIKE '%autovacuum%';"}
]},

{id:"autovac_activity", name:"Текущая активность autovacuum", badge:"vac",
desc:"Что прямо сейчас делает autovacuum — на каких таблицах работает и сколько времени.",
sql:`SELECT pid, now()-xact_start AS duration, CASE WHEN query ~ 'to prevent wraparound' THEN 'WRAPAROUND!' ELSE 'regular' END AS mode, left(query,100) AS query FROM pg_stat_activity WHERE query LIKE '%autovacuum%' AND state <> 'idle' AND pid <> pg_backend_pid() ORDER BY xact_start ASC;`,
cols:[
  {n:"duration", d:"Как долго autovacuum работает на этой таблице."},
  {n:"mode", d:"WRAPAROUND! = критично, не убивай! regular = плановая работа.", note:"Детали через pg_stat_progress_vacuum по pid из этого запроса."}
]},

{id:"xid_age", name:"Wraparound мониторинг (возраст XID)", badge:"vac",
desc:"КРИТИЧНО. При age > 1.5 млрд нужен срочный VACUUM FREEZE, иначе база заблокируется.",
sql:`SELECT datname, age(datfrozenxid) AS xid_age, round(age(datfrozenxid)*100.0/2000000000,1) AS pct_to_wraparound, pg_size_pretty(pg_database_size(datname)) AS db_size FROM pg_database WHERE datallowconn=true ORDER BY xid_age DESC;`,
cols:[
  {n:"xid_age", d:"Количество транзакций с последнего FREEZE. Максимум: ~2 млрд."},
  {n:"pct_to_wraparound", d:"% приближения к лимиту. > 50% = мониторинг; > 75% = срочно; > 90% = аварийно.", note:"При достижении autovacuum_freeze_max_age (200M) autovacuum запустит FREEZE. При высокой нагрузке может не успевать."}
]},

{id:"table_xid_age", name:"Возраст XID по таблицам (не только по БД)", badge:"vac",
desc:"Поиск конкретных таблиц которые тормозят VACUUM FREEZE и не дают снизить XID age базы.",
sql:`SELECT n.nspname AS schema_name, c.relname AS table_name, age(c.relfrozenxid) AS xid_age, round(age(c.relfrozenxid)*100.0/2000000000,1) AS pct_to_wraparound, pg_size_pretty(pg_table_size(c.oid)) AS table_size FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE c.relkind='r' AND n.nspname NOT IN ('pg_catalog','information_schema') ORDER BY age(c.relfrozenxid) DESC LIMIT 30;`,
cols:[
  {n:"xid_age", d:"Возраст XID для конкретной таблицы. Высокий = таблица давно не получала VACUUM FREEZE."},
  {n:"pct_to_wraparound", d:"Процент приближения таблицы к пределу.", note:"Запустить FREEZE: VACUUM FREEZE VERBOSE <table>;"}
]},

{id:"bloat_tables", name:"Bloat таблиц и индексов (статистический расчёт)", badge:"vac",
desc:"Оценка раздутия на основе pg_stats без блокировок. Погрешность 10-30%.",
sql:`SELECT current_database() AS db, schemaname, tablename, round(tbloat,1) AS tbl_bloat_ratio, pg_size_pretty(wastedbytes) AS tbl_wasted, iname AS index_name, round(ibloat,1) AS idx_bloat_ratio, pg_size_pretty(wastedibytes) AS idx_wasted FROM (SELECT schemaname, tablename, cc.reltuples, cc.relpages, bs, CEIL((cc.reltuples*((datahdr+ma-(CASE WHEN datahdr%ma=0 THEN ma ELSE datahdr%ma END))+nullhdr2+4))/(bs-20::float)) AS otta, COALESCE(c2.relname,'?') AS iname, COALESCE(c2.reltuples,0) AS ituples, COALESCE(c2.relpages,0) AS ipages, COALESCE(CEIL((c2.reltuples*(datahdr-12))/(bs-20::float)),0) AS iotta, ROUND((CASE WHEN otta=0 THEN 0.0 ELSE cc.relpages/otta END)::numeric,1) AS tbloat, CASE WHEN cc.relpages<otta THEN 0 ELSE bs*(cc.relpages-otta)::BIGINT END AS wastedbytes, ROUND((CASE WHEN iotta=0 OR ipages=0 THEN 0.0 ELSE ipages/iotta END)::numeric,1) AS ibloat, CASE WHEN ipages<iotta THEN 0 ELSE bs*(ipages-iotta) END AS wastedibytes FROM (SELECT schemaname, tablename, hdr, ma, bs, (datawidth+(hdr+ma-(CASE WHEN hdr%ma=0 THEN ma ELSE hdr%ma END)))::numeric AS datahdr, (maxfracsum*(nullhdr+ma-(CASE WHEN nullhdr%ma=0 THEN ma ELSE nullhdr%ma END))) AS nullhdr2 FROM (SELECT schemaname, tablename, hdr, ma, bs, SUM((1-null_frac)*avg_width) AS datawidth, MAX(null_frac) AS maxfracsum, hdr+(SELECT 1+count(*)/8 FROM pg_stats s2 WHERE null_frac<>0 AND s2.schemaname=s.schemaname AND s2.tablename=s.tablename) AS nullhdr FROM pg_stats s, (SELECT current_setting('block_size')::numeric AS bs, CASE WHEN substring(v,12,3) IN ('8.0','8.1','8.2') THEN 27 ELSE 23 END AS hdr, CASE WHEN v~'mingw32' THEN 8 ELSE 4 END AS ma FROM (SELECT version() AS v) foo) constants GROUP BY 1,2,3,4,5) foo2) foo JOIN pg_class cc ON cc.relname=tablename JOIN pg_namespace nn ON cc.relnamespace=nn.oid AND nn.nspname=schemaname AND nn.nspname<>'information_schema' LEFT JOIN pg_index i ON indrelid=cc.oid LEFT JOIN pg_class c2 ON c2.oid=i.indexrelid) sml WHERE wastedbytes>1024*1024 OR wastedibytes>1024*1024 ORDER BY wastedbytes+wastedibytes DESC LIMIT 30;`,
cols:[
  {n:"tbl_bloat_ratio", d:"Коэффициент раздутия. 1.0 = нет bloat. 2.0 = занимает вдвое больше. > 2 = нужен pg_repack."},
  {n:"tbl_wasted / idx_wasted", d:"Объём пустого места в таблице и индексе.", note:"bloat_ratio > 3 при большом wasted = кандидат для pg_repack (без блокировки)."}
]},

// ═══════════════════════════════════════════════
// ПРОГРЕСС ДЛИТЕЛЬНЫХ ОПЕРАЦИЙ
// ═══════════════════════════════════════════════
{section:"Прогресс операций", icon:"⏳", color:"#0d1a2e", dot:"#58a6ff"},

{id:"progress_all", name:"Все активные длительные операции (сводка)", badge:"",
desc:"Один запрос — все текущие прогрессы: VACUUM, ANALYZE, CREATE INDEX, BASEBACKUP, COPY. PG 13+.",
sql:`SELECT a.pid, a.datname, a.usename, CASE WHEN pv.pid IS NOT NULL THEN 'VACUUM' WHEN pa.pid IS NOT NULL THEN 'ANALYZE' WHEN pc.pid IS NOT NULL THEN 'CLUSTER/VACUUM FULL' WHEN pi.pid IS NOT NULL THEN 'CREATE INDEX/REINDEX' WHEN pb.pid IS NOT NULL THEN 'BASEBACKUP' WHEN po.pid IS NOT NULL THEN 'COPY' ELSE 'other' END AS operation, CASE WHEN pv.pid IS NOT NULL THEN pv.phase WHEN pa.pid IS NOT NULL THEN pa.phase WHEN pc.pid IS NOT NULL THEN pc.phase WHEN pi.pid IS NOT NULL THEN pi.phase WHEN pb.pid IS NOT NULL THEN pb.phase WHEN po.pid IS NOT NULL THEN 'active' ELSE '' END AS phase, CASE WHEN pv.pid IS NOT NULL THEN round(100.0*pv.heap_blks_vacuumed/NULLIF(pv.heap_blks_total,0),1) WHEN pa.pid IS NOT NULL THEN round(100.0*pa.sample_blks_scanned/NULLIF(pa.sample_blks_total,0),1) WHEN pc.pid IS NOT NULL THEN round(100.0*pc.heap_blks_scanned/NULLIF(pc.heap_blks_total,0),1) WHEN pi.pid IS NOT NULL THEN round(100.0*pi.blocks_done/NULLIF(pi.blocks_total,0),1) WHEN pb.pid IS NOT NULL THEN round(100.0*pb.backup_streamed/NULLIF(pb.backup_total,0),1) WHEN po.pid IS NOT NULL THEN round(100.0*po.tuples_processed/NULLIF(po.tuples_excluded+po.tuples_processed,0),1) ELSE NULL END AS pct_done, now()-a.query_start AS elapsed, left(a.query,80) AS query FROM pg_stat_activity a LEFT JOIN pg_stat_progress_vacuum pv ON pv.pid=a.pid LEFT JOIN pg_stat_progress_analyze pa ON pa.pid=a.pid LEFT JOIN pg_stat_progress_cluster pc ON pc.pid=a.pid LEFT JOIN pg_stat_progress_create_index pi ON pi.pid=a.pid LEFT JOIN pg_stat_progress_basebackup pb ON pb.pid=a.pid LEFT JOIN pg_stat_progress_copy po ON po.pid=a.pid WHERE pv.pid IS NOT NULL OR pa.pid IS NOT NULL OR pc.pid IS NOT NULL OR pi.pid IS NOT NULL OR pb.pid IS NOT NULL OR po.pid IS NOT NULL ORDER BY elapsed DESC;`,
cols:[
  {n:"operation", d:"Тип операции определённый по наличию записи в pg_stat_progress_*."},
  {n:"phase", d:"Текущая фаза операции."},
  {n:"pct_done", d:"Процент выполнения. NULL = данных для расчёта ещё нет.", note:"Для PG 12 убери LEFT JOIN pg_stat_progress_basebackup и pg_stat_progress_copy."}
]},

{id:"progress_vacuum", name:"Прогресс VACUUM (детально)", badge:"vac",
desc:"Фаза, прогресс, режим работы (wraparound/user/regular), размеры в читаемом виде.",
sql:`SELECT p.pid, now()-a.xact_start AS duration, COALESCE(a.wait_event_type||'.'||a.wait_event,'-') AS waiting, CASE WHEN a.query~'^autovacuum.*to prevent wraparound' THEN 'WRAPAROUND!' WHEN a.query~'^vacuum' THEN 'user' ELSE 'regular' END AS mode, p.datname, p.relid::regclass AS table_name, p.phase, pg_size_pretty(p.heap_blks_total*current_setting('block_size')::int) AS table_size, pg_size_pretty(pg_total_relation_size(p.relid)) AS total_size, round(100.0*p.heap_blks_vacuumed/NULLIF(p.heap_blks_total,0),1) AS pct_done, p.index_vacuum_count FROM pg_stat_progress_vacuum p JOIN pg_stat_activity a ON a.pid=p.pid ORDER BY duration DESC;
-- Примечание: num_dead_tuples/max_dead_tuples удалены в PG17+`,
cols:[
  {n:"mode", d:"WRAPAROUND! = критично, не убивай! user = ручной VACUUM; regular = плановый autovacuum."},
  {n:"pct_done", d:"Процент очищенных страниц."},
  {n:"index_vacuum_count", d:"> 1 = dead tuples не влезли в один проход (мало maintenance_work_mem)."},
  {n:"dead_buf_pct", d:"Заполненность буфера dead tuples. При 100% VACUUM прерывается и начинает новый проход.", note:"mode=WRAPAROUND! + долгая duration = аварийная ситуация. Не убивай!"}
]},

{id:"progress_create_index", name:"Прогресс CREATE INDEX / REINDEX", badge:"perf",
desc:"Фазы, блоки, строки. Включает все фазы CONCURRENTLY.",
sql:`SELECT d.datname, c.relname AS table_name, ci.relname AS index_name, i.phase, i.blocks_total, i.blocks_done, round(100.0*i.blocks_done/NULLIF(i.blocks_total,0),1) AS pct_blocks, i.tuples_total, i.tuples_done, round(100.0*i.tuples_done/NULLIF(i.tuples_total,0),1) AS pct_tuples, now()-a.query_start AS elapsed FROM pg_stat_progress_create_index i JOIN pg_database d ON i.datid=d.oid JOIN pg_class c ON i.relid=c.oid JOIN pg_class ci ON i.index_relid=ci.oid JOIN pg_stat_activity a ON a.pid=i.pid ORDER BY elapsed DESC;`,
cols:[
  {n:"phase", d:"initializing → waiting for writers → building index → waiting for readers (для CONCURRENTLY больше фаз)."},
  {n:"pct_blocks", d:"Основной индикатор прогресса для обычного CREATE INDEX.", note:"CONCURRENTLY: 2 прохода + дополнительные ожидания, но не блокирует DML."}
]},

{id:"progress_basebackup", name:"Прогресс pg_basebackup (PG 13+)", badge:"repl",
desc:"Прогресс создания базовой резервной копии. Запускать на мастере.",
sql:`SELECT a.pid, a.usename, a.client_addr, b.phase, pg_size_pretty(b.backup_total) AS backup_total, pg_size_pretty(b.backup_streamed) AS streamed, round(100.0*b.backup_streamed/NULLIF(b.backup_total,0),1) AS pct_done, b.tablespaces_total, b.tablespaces_streamed, now()-a.query_start AS elapsed FROM pg_stat_progress_basebackup b JOIN pg_stat_activity a ON a.pid=b.pid ORDER BY elapsed DESC;`,
cols:[
  {n:"phase", d:"waiting for checkpoint → estimating → streaming database files → waiting for WAL archiving → transferring WAL files."},
  {n:"pct_done", d:"NULL пока не завершилась фаза estimating backup size.", note:"PG 13+."}
]},

// ═══════════════════════════════════════════════
// РАЗМЕРЫ ОБЪЕКТОВ
// ═══════════════════════════════════════════════
{section:"Размеры объектов", icon:"💾", color:"#1a1a0d", dot:"#e3b341"},

{id:"db_sizes", name:"Размер всех баз данных", badge:"",
desc:"Дисковое потребление по базам + возраст XID + количество подключений.",
sql:`SELECT d.datname AS database, pg_size_pretty(pg_database_size(d.datname)) AS size, pg_database_size(d.datname) AS size_bytes, age(d.datfrozenxid) AS xid_age, (SELECT count(*) FROM pg_stat_activity WHERE datname=d.datname) AS connections FROM pg_database d WHERE d.datallowconn=true ORDER BY size_bytes DESC;`,
cols:[
  {n:"size", d:"Читаемый размер базы."},
  {n:"size_bytes", d:"Байты — для алертов и программной обработки."},
  {n:"xid_age", d:"Возраст XID для мониторинга wraparound."}
]},

{id:"table_sizes", name:"Топ-30 таблиц по размеру", badge:"",
desc:"Полная картина: данные + индексы + TOAST отдельно.",
sql:`SELECT n.nspname AS schema_name, c.relname AS table_name, pg_size_pretty(pg_table_size(c.oid)) AS table_size, pg_size_pretty(pg_indexes_size(c.oid)) AS indexes_size, pg_size_pretty(pg_total_relation_size(c.oid)) AS total_size, pg_total_relation_size(c.oid) AS total_bytes, c.reltuples::bigint AS est_rows FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE c.relkind IN ('r','p') AND n.nspname NOT IN ('pg_catalog','information_schema','pg_toast') ORDER BY total_bytes DESC LIMIT 30;`,
cols:[
  {n:"table_size", d:"Только данные таблицы (без индексов и TOAST)."},
  {n:"indexes_size", d:"Суммарный размер всех индексов."},
  {n:"total_size", d:"Таблица + индексы + TOAST — реальный размер на диске.", note:"total_size >> table_size = много индексов или большие TOAST-поля (json/text/bytea)."}
]},

{id:"schema_sizes", name:"Размер всех схем", badge:"",
desc:"Суммарное дисковое потребление по схемам внутри текущей базы.",
sql:`SELECT n.nspname AS schema_name, count(c.oid) AS table_count, pg_size_pretty(sum(pg_total_relation_size(c.oid))) AS total_size, sum(pg_total_relation_size(c.oid)) AS total_bytes FROM pg_namespace n LEFT JOIN pg_class c ON c.relnamespace=n.oid AND c.relkind IN ('r','p') WHERE n.nspname NOT IN ('pg_catalog','information_schema','pg_toast') GROUP BY n.nspname ORDER BY total_bytes DESC NULLS LAST;`,
cols:[
  {n:"total_size", d:"Суммарный размер всех таблиц и индексов в схеме."},
  {n:"table_count", d:"Количество таблиц в схеме."}
]},

{id:"table_row_count", name:"Точное количество строк в таблицах", badge:"",
desc:"Точные данные через pg_stat_get_live_tuples — актуально после VACUUM/ANALYZE.",
sql:`SELECT n.nspname AS schema_name, c.relname AS table_name, pg_stat_get_live_tuples(c.oid) AS live_rows, pg_stat_get_dead_tuples(c.oid) AS dead_rows, pg_size_pretty(pg_table_size(c.oid)) AS table_size FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE c.relkind='r' AND n.nspname NOT IN ('pg_catalog','information_schema') ORDER BY live_rows DESC LIMIT 50;`,
cols:[
  {n:"live_rows", d:"Актуальное количество живых строк."},
  {n:"dead_rows", d:"Мёртвые кортежи — если много, нужен VACUUM."}
]},

{id:"tablespace_sizes", name:"Размер tablespace-ов", badge:"",
desc:"Размер каждого tablespace — полезно если данные разнесены по разным дискам.",
sql:`SELECT spcname AS tablespace_name, pg_tablespace_location(oid) AS location, pg_size_pretty(pg_tablespace_size(oid)) AS size, pg_tablespace_size(oid) AS size_bytes FROM pg_tablespace ORDER BY size_bytes DESC;`,
cols:[
  {n:"location", d:"Путь на диске. Пустой = это pg_default или pg_global (в PGDATA)."},
  {n:"size", d:"Суммарный размер всех объектов в этом tablespace."}
]},

// ═══════════════════════════════════════════════
// КОНФИГУРАЦИЯ И ЗДОРОВЬЕ
// ═══════════════════════════════════════════════
{section:"Конфигурация и здоровье", icon:"❤️", color:"#1a0d0d", dot:"#f85149"},

{id:"cache_hit_ratio", name:"Cache hit ratio и статистика ошибок по БД", badge:"",
desc:"Главный показатель эффективности shared_buffers + rollback%, deadlocks, temp files.",
sql:`SELECT datname, blks_read, blks_hit, round(100.0*blks_hit/NULLIF(blks_hit+blks_read,0),2) AS cache_hit_pct, xact_commit, xact_rollback, round(100.0*xact_rollback/NULLIF(xact_commit+xact_rollback,0),2) AS rollback_pct, deadlocks, temp_files, pg_size_pretty(temp_bytes) AS temp_size, stats_reset FROM pg_stat_database WHERE datname NOT IN ('template0','template1') ORDER BY blks_hit+blks_read DESC;`,
cols:[
  {n:"cache_hit_pct", d:"% запросов из RAM. < 95% = shared_buffers мал или много cold reads."},
  {n:"rollback_pct", d:"% откатов. Высокий = много ошибок в приложении."},
  {n:"deadlocks", d:"Количество deadlock-ов. > 0 = проблема в логике приложения."},
  {n:"temp_size", d:"Размер временных файлов = work_mem мал. Увеличь work_mem.", note:"Норма cache_hit_pct: > 99% для OLTP, > 95% для аналитики."}
]},

{id:"bgwriter_stats", name:"Статистика bgwriter (PG < 17)", badge:"",
desc:"Эффективность буферного менеджера. Много buffers_backend = shared_buffers мал. Для PG < 17.",
sql:`SELECT checkpoints_timed, checkpoints_req, round(100.0*checkpoints_req/NULLIF(checkpoints_timed+checkpoints_req,0),1) AS forced_pct, checkpoint_write_time, checkpoint_sync_time, buffers_checkpoint, buffers_clean, buffers_backend, round(100.0*buffers_backend/NULLIF(buffers_checkpoint+buffers_clean+buffers_backend,0),1) AS backend_write_pct, buffers_alloc, stats_reset FROM pg_stat_bgwriter;`,
cols:[
  {n:"forced_pct", d:"% принудительных checkpoint. > 10% = нужно увеличить checkpoint_completion_target или max_wal_size."},
  {n:"buffers_backend", d:"Буферы записанные напрямую backend-процессами. Плохо — bgwriter не успевает."},
  {n:"backend_write_pct", d:"% записей через backend. > 10% = увеличь shared_buffers или bgwriter_lru_maxpages.", note:"Сбросить: SELECT pg_stat_reset_shared('bgwriter'); Для PG 17+ используй pg_stat_checkpointer."}
]},

{id:"checkpointer_stats", name:"Статистика checkpointer (PG 17+)", badge:"",
desc:"Статистика checkpointer вынесена в отдельное вью начиная с PG 17.",
sql:`SELECT num_timed AS checkpoints_timed, num_requested AS checkpoints_req, round(100.0*num_requested/NULLIF(num_timed+num_requested,0),1) AS forced_pct, write_time AS checkpoint_write_ms, sync_time AS checkpoint_sync_ms, buffers_written, stats_reset FROM pg_stat_checkpointer;`,
cols:[
  {n:"forced_pct", d:"% принудительных checkpoint из-за переполнения WAL. > 10% = нужно увеличить max_wal_size."},
  {n:"checkpoint_write_ms", d:"Суммарное время записи страниц во время checkpoint."},
  {n:"checkpoint_sync_ms", d:"Суммарное время fsync. Высокое = медленный диск или много грязных страниц.", note:"Доступно только в PostgreSQL 17+."}
]},

{id:"wal_stat_pg14", name:"Статистика WAL (PG 14+)", badge:"",
desc:"Объём сгенерированного WAL, количество записей и синхронизаций.",
sql:`SELECT wal_records, wal_fpi, wal_bytes, pg_size_pretty(wal_bytes) AS wal_size_pretty, wal_buffers_full, wal_write, wal_sync, wal_write_time, wal_sync_time, stats_reset FROM pg_stat_wal;`,
cols:[
  {n:"wal_bytes", d:"Суммарный объём сгенерированных WAL-данных."},
  {n:"wal_fpi", d:"Full page images. Много = частые checkpoints или включён full_page_writes."},
  {n:"wal_buffers_full", d:"Сколько раз WAL-буферы переполнялись вне плана. Увеличь wal_buffers.", note:"Доступно с PostgreSQL 14."}
]},

{id:"pg_stat_io_pg16", name:"Статистика IO по типам процессов (PG 16+)", badge:"",
desc:"Детальная статистика чтений и записей с разбивкой по типу процесса.",
sql:`SELECT backend_type, object, context, reads, writes, writebacks, hits, evictions, reuses, fsyncs, read_time, write_time FROM pg_stat_io WHERE reads+writes+hits > 0 ORDER BY reads+writes DESC LIMIT 30;`,
cols:[
  {n:"backend_type", d:"Тип процесса: client backend, autovacuum worker, bgwriter, checkpointer и т.д."},
  {n:"hits", d:"Попадания в shared_buffers — хорошо."},
  {n:"evictions", d:"Вытеснений из shared_buffers — высокое = кеш мал.", note:"Доступно с PostgreSQL 16."}
]},

// ═══════════════════════════════════════════════
// СХЕМА И МЕТАДАННЫЕ
// ═══════════════════════════════════════════════
{section:"Схема и метаданные", icon:"🗄", color:"#0d1a2e", dot:"#79c0ff"},

{id:"table_structure", name:"Структура таблицы (колонки, типы, nullable)", badge:"",
desc:"Полная структура таблицы — колонки, типы данных, значения по умолчанию, NULL-допустимость.",
sql:`SELECT ordinal_position AS pos, column_name, data_type, character_maximum_length AS max_len, numeric_precision, numeric_scale, is_nullable, column_default FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'your_table_name' ORDER BY ordinal_position;`,
cols:[
  {n:"data_type", d:"Тип данных колонки."},
  {n:"is_nullable", d:"YES = NULL разрешён. NO = NOT NULL ограничение."},
  {n:"column_default", d:"Значение по умолчанию или NULL если не задано.", note:"Замени 'your_table_name' на нужное имя таблицы."}
]},

{id:"indexes_for_table", name:"Все индексы таблицы с определениями", badge:"",
desc:"Список индексов конкретной таблицы с полным DDL, типами и уникальностью.",
sql:`SELECT i.relname AS indexname, pg_get_indexdef(i.oid) AS indexdef, pg_size_pretty(pg_relation_size(i.oid)) AS size, ix.indisunique AS is_unique, ix.indisprimary AS is_primary, ix.indisvalid AS is_valid, s.idx_scan, s.idx_tup_read, s.idx_tup_fetch FROM pg_index ix JOIN pg_class t ON t.oid=ix.indrelid JOIN pg_class i ON i.oid=ix.indexrelid JOIN pg_namespace n ON n.oid=t.relnamespace LEFT JOIN pg_stat_user_indexes s ON s.indexrelid=i.oid WHERE n.nspname='public' AND t.relname='your_table_name' ORDER BY s.idx_scan DESC NULLS LAST;`,
cols:[
  {n:"indexdef", d:"Полное DDL определение индекса — можно скопировать и пересоздать."},
  {n:"is_valid", d:"false = индекс повреждён или ещё строится (CREATE INDEX CONCURRENTLY не завершился)."},
  {n:"idx_scan", d:"Количество сканирований. 0 = индекс не используется.", note:"Замени 'your_table_name' на нужное имя таблицы."}
]},

{id:"constraints_for_table", name:"Ограничения таблицы (PK, FK, CHECK, UNIQUE)", badge:"",
desc:"Все constraints таблицы с определениями — полезно при диагностике ошибок.",
sql:`SELECT c.conname AS constraint_name, c.contype AS type, CASE c.contype WHEN 'p' THEN 'PRIMARY KEY' WHEN 'f' THEN 'FOREIGN KEY' WHEN 'c' THEN 'CHECK' WHEN 'u' THEN 'UNIQUE' WHEN 'x' THEN 'EXCLUSION' ELSE c.contype::text END AS type_name, pg_get_constraintdef(c.oid) AS definition FROM pg_constraint c JOIN pg_class t ON t.oid=c.conrelid WHERE t.relname='your_table_name' ORDER BY c.contype;`,
cols:[
  {n:"contype", d:"p = PRIMARY KEY; f = FOREIGN KEY; c = CHECK; u = UNIQUE; x = EXCLUSION."},
  {n:"definition", d:"Полное определение ограничения.", note:"Замени 'your_table_name' на нужное имя таблицы."}
]},

{id:"partitions_list", name:"Список секций партиционированной таблицы", badge:"",
desc:"Все секции (partitions) с размерами, числом строк и диапазонами значений.",
sql:`-- Замени 'public' на нужную схему, 'your_table_name' на имя таблицы
SELECT n.nspname AS schema_name, parent.relname AS parent_table, child.relname AS partition_name, pg_get_expr(child.relpartbound, child.oid) AS partition_bound, pg_size_pretty(pg_total_relation_size(child.oid)) AS total_size, pg_stat_get_live_tuples(child.oid) AS live_rows FROM pg_class parent JOIN pg_namespace n ON n.oid=parent.relnamespace JOIN pg_inherits ON parent.oid=pg_inherits.inhparent JOIN pg_class child ON child.oid=pg_inherits.inhrelid WHERE parent.relname='your_table_name' AND n.nspname='public' ORDER BY pg_total_relation_size(child.oid) DESC;`,
cols:[
  {n:"partition_bound", d:"Диапазон значений для этой секции (FOR VALUES FROM ... TO ...)."},
  {n:"total_size", d:"Полный размер секции включая индексы."},
  {n:"live_rows", d:"Живых строк в секции.", note:"Замени 'your_table_name' на имя родительской таблицы."}
]},

{id:"tables_without_pk", name:"Таблицы без первичного ключа", badge:"perf",
desc:"Таблицы без PK — проблема для репликации (особенно logical), обновлений и join-ов.",
sql:`SELECT n.nspname AS schema_name, c.relname AS table_name, pg_size_pretty(pg_table_size(c.oid)) AS table_size, pg_stat_get_live_tuples(c.oid) AS live_rows FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE c.relkind='r' AND n.nspname NOT IN ('pg_catalog','information_schema') AND NOT EXISTS (SELECT FROM pg_index WHERE indrelid=c.oid AND indisprimary) ORDER BY pg_table_size(c.oid) DESC;`,
cols:[
  {n:"table_name", d:"Имя таблицы без первичного ключа."},
  {n:"table_size", d:"Размер таблицы — большие таблицы без PK особенно проблематичны.", note:"Для logical replication таблицы без PK нужно иметь REPLICA IDENTITY FULL — это медленно."}
]},

{id:"object_owner", name:"Список объектов БД с владельцами", badge:"",
desc:"Таблицы, вьюхи, функции — кто является owner каждого объекта.",
sql:`SELECT n.nspname AS schema_name, c.relname AS object_name, CASE c.relkind WHEN 'r' THEN 'table' WHEN 'v' THEN 'view' WHEN 'm' THEN 'materialized view' WHEN 'p' THEN 'partitioned table' WHEN 'i' THEN 'index' WHEN 'S' THEN 'sequence' END AS object_type, pg_get_userbyid(c.relowner) AS owner, pg_size_pretty(pg_total_relation_size(c.oid)) AS size FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname NOT IN ('pg_catalog','information_schema','pg_toast') AND c.relkind IN ('r','v','m','p','S') ORDER BY n.nspname, c.relkind, c.relname;`,
cols:[
  {n:"object_type", d:"Тип объекта: table, view, materialized view, partitioned table, sequence."},
  {n:"owner", d:"Владелец объекта. Важно проверять при миграции или создании новых ролей."}
]},

// ═══════════════════════════════════════════════
// РОЛИ И ПРАВА
// ═══════════════════════════════════════════════
{section:"Роли и права", icon:"🔑", color:"#1a1a0a", dot:"#e3b341"},

{id:"roles_list", name:"Список всех ролей и их атрибуты", badge:"",
desc:"Все роли PostgreSQL: суперюзер, создание БД, репликация, срок действия пароля.",
sql:`SELECT rolname AS role_name, rolsuper AS is_superuser, rolinherit AS inherits, rolcreaterole AS can_create_roles, rolcreatedb AS can_create_db, rolcanlogin AS can_login, rolreplication AS is_replication, rolconnlimit AS conn_limit, rolvaliduntil AS password_expires FROM pg_roles ORDER BY rolsuper DESC, rolcanlogin DESC, rolname;`,
cols:[
  {n:"is_superuser", d:"true = суперпользователь — обходит все проверки прав. Минимизируй количество."},
  {n:"can_login", d:"true = это роль-пользователь которая может входить. false = группа."},
  {n:"is_replication", d:"true = роль может создавать слоты репликации."},
  {n:"password_expires", d:"Дата истечения пароля. NULL = бессрочный. Проверяй регулярно.", note:"Роли без can_login — это группы, используемые для управления правами."}
]},

{id:"role_memberships", name:"Членство в группах (кто в какой роли)", badge:"",
desc:"Иерархия ролей — какие роли включены в другие роли (GRANT role TO user).",
sql:`SELECT r.rolname AS role, m.rolname AS member, am.admin_option, g.rolname AS granted_by FROM pg_auth_members am JOIN pg_roles r ON r.oid=am.roleid JOIN pg_roles m ON m.oid=am.member LEFT JOIN pg_roles g ON g.oid=am.grantor ORDER BY r.rolname, m.rolname;`,
cols:[
  {n:"role", d:"Группа/роль в которую включён пользователь."},
  {n:"member", d:"Пользователь или роль, которая является членом."},
  {n:"admin_option", d:"true = этот member может сам добавлять других в группу."}
]},

{id:"table_grants", name:"Права на таблицы текущей БД", badge:"",
desc:"Кто имеет доступ к каким таблицам — полный список прав.",
sql:`SELECT table_schema, table_name, grantee, privilege_type, is_grantable FROM information_schema.role_table_grants WHERE table_schema NOT IN ('pg_catalog','information_schema') ORDER BY table_schema, table_name, grantee, privilege_type;`,
cols:[
  {n:"grantee", d:"Роль которой выдано право. PUBLIC = все пользователи."},
  {n:"privilege_type", d:"SELECT, INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER."},
  {n:"is_grantable", d:"YES = этот grantee может сам выдавать это право другим (WITH GRANT OPTION)."}
]},

{id:"schema_usage_check", name:"Права USAGE на схемы для роли", badge:"",
desc:"Проверка: есть ли у конкретной роли права USAGE на все схемы. Замени 'your_role'.",
sql:`SELECT n.nspname AS schema_name, has_schema_privilege('your_role', n.nspname, 'USAGE') AS has_usage, has_schema_privilege('your_role', n.nspname, 'CREATE') AS has_create FROM pg_namespace n WHERE n.nspname NOT LIKE 'pg_%' AND n.nspname <> 'information_schema' ORDER BY n.nspname;`,
cols:[
  {n:"has_usage", d:"true = роль может видеть объекты в схеме. false = схема невидима для роли."},
  {n:"has_create", d:"true = роль может создавать объекты в схеме.", note:"Замени 'your_role' на нужное имя роли."}
]},

{id:"grant_usage_all_schemas", name:"Выдать USAGE на все схемы для роли", badge:"",
desc:"Скрипт: выдать права USAGE на все пользовательские схемы одной командой.",
sql:`DO $$ DECLARE r RECORD; BEGIN FOR r IN SELECT nspname FROM pg_namespace WHERE nspname NOT LIKE 'pg_%' AND nspname <> 'information_schema' LOOP EXECUTE format('GRANT USAGE ON SCHEMA %I TO your_role;', r.nspname); END LOOP; END $$;`,
cols:[
  {n:"EXECUTE format()", d:"Динамически формирует и выполняет GRANT для каждой схемы.", note:"Замени 'your_role' на нужное имя роли. Добавь аналогично GRANT SELECT ON ALL TABLES IN SCHEMA..."}
]},

{id:"active_connections_by_role", name:"Активные подключения по ролям", badge:"",
desc:"Сколько активных соединений у каждого пользователя прямо сейчас.",
sql:`SELECT usename AS role_name, count(*) AS connections, count(*) FILTER (WHERE state='active') AS active, count(*) FILTER (WHERE state='idle in transaction') AS idle_in_txn, count(*) FILTER (WHERE state='idle') AS idle, max(now()-backend_start) AS longest_connection FROM pg_stat_activity WHERE pid <> pg_backend_pid() GROUP BY usename ORDER BY connections DESC;`,
cols:[
  {n:"connections", d:"Общее число соединений от этой роли."},
  {n:"idle_in_txn", d:"Опасные idle in transaction соединения — держат локи."},
  {n:"longest_connection", d:"Продолжительность самого старого соединения этой роли."}
]},

// ═══════════════════════════════════════════════
// ОПЕРАЦИОННАЯ СИСТЕМА
// ═══════════════════════════════════════════════
{section:"Операционная система", icon:"🐧", color:"#1f2a0d", dot:"#56d364"},

{id:"os_disk", name:"Использование дискового пространства", badge:"os",
desc:"Все файловые системы: размер, занято, свободно. > 85% = алерт.",
sql:`df -hT | grep -vE '^tmpfs|^devtmpfs|^udev|^overlay'`,
cols:[
  {n:"Type", d:"Тип ФС. xfs рекомендован для PostgreSQL."},
  {n:"Use%", d:"> 85% = алерт; > 95% = аварийная ситуация. PostgreSQL при 100% падает с PANIC.", note:"Настрой алерт на 80%."}
]},

{id:"os_disk_pg", name:"Размер директорий PostgreSQL", badge:"os",
desc:"Реальный размер: data, WAL, логи — по отдельности.",
sql:`du -sh $PGDATA && echo "" && du -sh $PGDATA/base $PGDATA/pg_wal $PGDATA/pg_log $PGDATA/pg_tblspc 2>/dev/null | sort -rh`,
cols:[
  {n:"pg_wal/", d:"WAL-сегменты. Большой размер = много незаархивированных WAL или реплика отстаёт."},
  {n:"pg_log/", d:"Лог-файлы. Можно безопасно ротировать/удалять старые."}
]},

{id:"os_mem", name:"Использование памяти и swap", badge:"os",
desc:"Состояние RAM и swap. PostgreSQL в свопе = катастрофа производительности.",
sql:`free -h && echo "" && grep -E 'MemTotal|MemAvailable|SwapTotal|SwapFree|Dirty:|Cached:' /proc/meminfo`,
cols:[
  {n:"MemAvailable", d:"Доступно без свопа. Должна быть > 20% от total."},
  {n:"Dirty", d:"Данные изменены в памяти, не записаны на диск. Высокое = нагрузка на IO."},
  {n:"SwapFree", d:"Swap используется = postgres работает в разы медленнее.", note:"vm.swappiness = 1-10 для серверов с PostgreSQL."}
]},

{id:"os_io", name:"Нагрузка на диск в реальном времени", badge:"os",
desc:"IOPS, пропускная способность, утилизация и latency по каждому устройству.",
sql:`iostat -xhd 2 5`,
cols:[
  {n:"%util", d:"Загруженность устройства. > 80% стабильно = диск перегружен."},
  {n:"await", d:"Среднее время ожидания IO (мс). NVMe < 0.1; SSD < 1; HDD < 10.", note:"apt install sysstat — если iostat не установлен."}
]},

{id:"os_cpu", name:"Нагрузка CPU и топ postgres-процессов", badge:"os",
desc:"Load average и какие postgres-процессы нагружают CPU прямо сейчас.",

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PostgreSQL DBA Cheatsheet</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

:root {
  --bg: #0d1117;
  --bg2: #161b22;
  --bg3: #21262d;
  --bg4: #2d333b;
  --border: #30363d;
  --border2: #444c56;
  --text: #e6edf3;
  --text2: #8b949e;
  --text3: #6e7681;
  --blue: #58a6ff;
  --blue-bg: #0d2236;
  --blue-border: #1f4068;
  --green: #3fb950;
  --green-bg: #0d2117;
  --green-border: #1a4228;
  --orange: #d29922;
  --orange-bg: #261d0a;
  --orange-border: #4a3500;
  --red: #f85149;
  --red-bg: #2a0d0d;
  --red-border: #4a1515;
  --purple: #bc8cff;
  --purple-bg: #1a0d2e;
  --purple-border: #3a1f5e;
  --accent: #58a6ff;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'IBM Plex Sans', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
}

/* LAYOUT */
.shell {
  display: flex;
  min-height: 100vh;
}

/* SIDEBAR */
.sidebar {
  width: 240px;
  flex-shrink: 0;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  position: fixed;
  top: 0; left: 0; bottom: 0;
  overflow-y: auto;
  z-index: 10;
  padding-bottom: 2rem;
}

.sidebar-logo {
  padding: 1.25rem 1rem 1rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 0.5rem;
}
.sidebar-logo .pg-icon {
  display: flex; align-items: center; gap: 8px;
}
.sidebar-logo .pg-icon svg { flex-shrink: 0; }
.sidebar-logo .pg-title {
  font-size: 15px; font-weight: 600; color: var(--text);
  font-family: var(--mono);
}
.sidebar-logo .pg-sub {
  font-size: 11px; color: var(--text3); margin-top: 2px;
}

.sidebar-search {
  padding: 0.5rem 0.75rem;
  margin-bottom: 0.25rem;
}
.sidebar-search input {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: var(--sans);
  font-size: 12px;
  padding: 6px 10px;
  outline: none;
  transition: border-color 0.15s;
}
.sidebar-search input:focus { border-color: var(--blue); }
.sidebar-search input::placeholder { color: var(--text3); }

.nav-section {
  padding: 0.75rem 0.75rem 0.25rem;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text3);
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 5px 12px;
  font-size: 12.5px;
  color: var(--text2);
  cursor: pointer;
  border-radius: 0;
  transition: background 0.1s, color 0.1s;
  border-left: 2px solid transparent;
  text-decoration: none;
}
.nav-item:hover { background: var(--bg3); color: var(--text); }
.nav-item.active {
  color: var(--blue);
  border-left-color: var(--blue);
  background: var(--blue-bg);
}
.nav-dot {
  width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
}
.nav-count {
  margin-left: auto;
  font-size: 10px;
  background: var(--bg4);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1px 6px;
  color: var(--text3);
}

/* MAIN */
.main {
  margin-left: 240px;
  flex: 1;
  min-width: 0;
}

/* TOPBAR */
.topbar {
  position: sticky; top: 0; z-index: 5;
  background: rgba(13,17,23,0.92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  padding: 0.75rem 2rem;
  display: flex;
  align-items: center;
  gap: 12px;
}
.topbar-title {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--text2);
}
.topbar-title span { color: var(--blue); }
.topbar-stats {
  margin-left: auto;
  display: flex; gap: 16px;
}
.topbar-stat {
  font-size: 11px; color: var(--text3);
}
.topbar-stat strong { color: var(--text2); font-weight: 500; }

/* CONTENT */
.content {
  padding: 2rem;
  max-width: 900px;
}

.section-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 2rem 0 1rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--border);
}
.section-header:first-child { margin-top: 0; }
.section-icon {
  width: 28px; height: 28px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0;
}
.section-title-text {
  font-size: 15px; font-weight: 600; color: var(--text);
  font-family: var(--mono);
}
.section-count {
  margin-left: auto;
  font-size: 11px; color: var(--text3);
  font-family: var(--mono);
  background: var(--bg3);
  border: 1px solid var(--border);
  padding: 2px 8px;
  border-radius: 10px;
}

/* CARD */
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.card:hover { border-color: var(--border2); }
.card.open { border-color: var(--border2); }

.card-header {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 14px;
  cursor: pointer;
  user-select: none;
}

.chevron {
  flex-shrink: 0; width: 14px; height: 14px;
  margin-top: 3px; color: var(--text3);
  transition: transform 0.2s;
}
.card.open .chevron { transform: rotate(90deg); }

.card-meta { flex: 1; min-width: 0; }
.card-name {
  font-size: 13.5px; font-weight: 500; color: var(--text);
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.card-desc {
  font-size: 12px; color: var(--text2);
  margin-top: 2px; line-height: 1.4;
}

.badge {
  font-size: 10px; font-weight: 500;
  padding: 1px 7px; border-radius: 10px;
  white-space: nowrap; flex-shrink: 0;
  font-family: var(--mono);
}
.b-os     { background: var(--orange-bg); color: var(--orange); border: 1px solid var(--orange-border); }
.b-repl   { background: var(--blue-bg);   color: var(--blue);   border: 1px solid var(--blue-border); }
.b-perf   { background: var(--green-bg);  color: var(--green);  border: 1px solid var(--green-border); }
.b-lock   { background: var(--red-bg);    color: var(--red);    border: 1px solid var(--red-border); }
.b-vac    { background: var(--purple-bg); color: var(--purple); border: 1px solid var(--purple-border); }

/* CARD BODY */
.card-body { display: none; padding: 0 14px 14px; }
.card.open .card-body { display: block; }

.code-wrap { position: relative; margin-bottom: 12px; }
pre {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
  font-family: var(--mono);
  font-size: 12px;
  color: #c9d1d9;
  white-space: pre;
  overflow-x: auto;
  line-height: 1.7;
  tab-size: 2;
}

/* Syntax highlight */
.k { color: #ff7b72; }   /* keyword */
.f { color: #d2a8ff; }   /* function */
.s { color: #a5d6ff; }   /* string/number */
.c { color: #6e7681; font-style: italic; } /* comment */
.t { color: #ffa657; }   /* type/column name */

.copy-btn {
  font-size: 11px; font-family: var(--mono);
  padding: 3px 10px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text2);
  cursor: pointer;
  transition: all 0.15s;
}
.copy-btn:hover { border-color: var(--blue); color: var(--blue); }
.copy-btn.copied { border-color: var(--green); color: var(--green); }

/* COLUMNS TABLE */
.cols-label {
  font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
  text-transform: uppercase; color: var(--text3);
  margin-bottom: 6px;
  font-family: var(--mono);
}
.cols-table { width: 100%; border-collapse: collapse; }
.cols-table tr { border-bottom: 1px solid var(--border); }
.cols-table tr:last-child { border-bottom: none; }
.cols-table td {
  padding: 6px 8px; vertical-align: top; font-size: 12px;
}
.col-n {
  font-family: var(--mono); font-size: 11.5px;
  color: var(--blue); white-space: nowrap;
  padding-right: 16px; width: 1%;
}
.col-d { color: var(--text2); line-height: 1.5; }
.col-note {
  display: block;
  font-size: 11px; color: var(--text3);
  margin-top: 3px; line-height: 1.4;
  border-left: 2px solid var(--border2);
  padding-left: 6px;
  margin-top: 4px;
}

/* FOOTER */
.footer {
  padding: 2rem;
  border-top: 1px solid var(--border);
  color: var(--text3);
  font-size: 11px;
  font-family: var(--mono);
}

/* EMPTY STATE */
.empty {
  text-align: center; padding: 3rem;
  color: var(--text3); font-size: 13px;
}

/* SCROLLBAR */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text3); }

/* HIDDEN */
.hidden { display: none !important; }

/* EDIT BUTTON */
.edit-btn {
  font-size: 11px; font-family: var(--mono);
  padding: 3px 10px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text2);
  cursor: pointer;
  transition: all 0.15s;
}
.edit-btn:hover { border-color: var(--orange); color: var(--orange); }
.edit-btn.active { border-color: var(--orange); color: var(--orange); background: var(--orange-bg); }

/* MODIFIED BADGE */
.modified-dot {
  display: inline-block;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--orange);
  margin-left: 6px;
  flex-shrink: 0;
  title: "Изменено";
}

/* EDITOR AREA */
.editor-wrap {
  display: none;
  margin-bottom: 12px;
  border: 1px solid var(--orange-border);
  border-radius: 6px;
  overflow: hidden;
}
.editor-wrap.visible { display: block; }
.editor-toolbar {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px;
  background: var(--orange-bg);
  border-bottom: 1px solid var(--orange-border);
}
.editor-label {
  font-size: 11px; font-family: var(--mono);
  color: var(--orange); flex: 1;
}
.editor-btn {
  font-size: 11px; font-family: var(--mono);
  padding: 3px 10px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s;
}
.editor-save {
  background: var(--green-bg);
  border: 1px solid var(--green-border);
  color: var(--green);
}
.editor-save:hover { background: var(--green); color: var(--bg); }
.editor-reset {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text3);
}
.editor-reset:hover { border-color: var(--red); color: var(--red); }
.editor-cancel {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text3);
}
.editor-cancel:hover { border-color: var(--border2); color: var(--text2); }
textarea.sql-editor {
  width: 100%;
  background: var(--bg);
  border: none;
  outline: none;
  color: #c9d1d9;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.7;
  padding: 12px 14px;
  resize: vertical;
  min-height: 160px;
  tab-size: 2;
}
textarea.sql-editor:focus { background: #0d1117; }

/* ADD BUTTON in topbar */
.add-btn {
  font-size: 12px; font-family: var(--mono);
  padding: 4px 14px;
  background: var(--green-bg);
  border: 1px solid var(--green-border);
  border-radius: 5px;
  color: var(--green);
  cursor: pointer;
  transition: all 0.15s;
  margin-left: 12px;
}
.add-btn:hover { background: var(--green); color: var(--bg); }

/* MODAL OVERLAY */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 100; align-items: center; justify-content: center;
  padding: 1rem;
}
.modal-overlay.visible { display: flex; }
.modal {
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 10px; width: 100%; max-width: 700px;
  max-height: 92vh; overflow-y: auto;
  display: flex; flex-direction: column;
}
.modal-header {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.modal-title {
  font-size: 14px; font-weight: 500;
  font-family: var(--mono); color: var(--text); flex: 1;
}
.modal-close {
  background: none; border: none; color: var(--text3);
  cursor: pointer; font-size: 18px; line-height: 1;
  padding: 2px 6px; border-radius: 4px;
}
.modal-close:hover { color: var(--text); background: var(--bg3); }
.modal-body { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.form-row { display: flex; flex-direction: column; gap: 5px; }
.form-label {
  font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--text3); font-family: var(--mono);
}
.form-input {
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  color: var(--text); font-family: var(--sans); font-size: 13px;
  padding: 8px 10px; outline: none; transition: border-color 0.15s; width: 100%;
}
.form-input:focus { border-color: var(--blue); }
.form-textarea {
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  color: var(--text); font-family: var(--mono); font-size: 12px;
  padding: 8px 10px; outline: none; transition: border-color 0.15s; width: 100%;
  resize: vertical; line-height: 1.7; tab-size: 2;
}
.form-textarea.desc-ta {
  font-family: var(--sans); font-size: 13px;
  min-height: 58px; white-space: normal; line-height: 1.5;
}
.form-textarea.sql-ta { min-height: 180px; color: #c9d1d9; }
.form-textarea:focus { border-color: var(--blue); }

/* Section chips */
.section-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 2px; }
.s-chip {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 11px; border-radius: 6px;
  border: 2px solid transparent; cursor: pointer;
  font-size: 12px; font-family: var(--mono);
  background: var(--bg3); color: var(--text2);
  transition: all 0.12s; user-select: none;
}
.s-chip:hover { color: var(--text); border-color: var(--border2); }
.s-chip.sel { color: var(--text); }
.s-chip-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* Columns editor */
.cols-editor-wrap { display: flex; flex-direction: column; gap: 6px; }
.col-edit-row {
  display: grid; grid-template-columns: 150px 1fr 30px;
  gap: 6px; align-items: start;
}
.col-edit-row input, .col-edit-row textarea {
  background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
  color: var(--text); font-family: var(--mono); font-size: 11.5px;
  padding: 5px 8px; outline: none; width: 100%; transition: border-color 0.15s;
}
.col-edit-row textarea {
  font-family: var(--sans); font-size: 12px;
  min-height: 50px; resize: vertical;
}
.col-edit-row input:focus, .col-edit-row textarea:focus { border-color: var(--blue); }
.col-del {
  background: none; border: 1px solid var(--border); border-radius: 4px;
  color: var(--text3); cursor: pointer; padding: 5px 6px;
  font-size: 12px; transition: all 0.12s; align-self: start;
}
.col-del:hover { border-color: var(--red); color: var(--red); }
.add-col-row {
  background: none; border: 1px dashed var(--border2); border-radius: 4px;
  color: var(--text3); cursor: pointer; padding: 6px;
  font-size: 12px; font-family: var(--mono); transition: all 0.12s; text-align: center;
}
.add-col-row:hover { border-color: var(--blue); color: var(--blue); }

.modal-footer {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 18px; border-top: 1px solid var(--border); flex-shrink: 0;
}
.modal-save {
  font-size: 12px; font-family: var(--mono); padding: 6px 20px;
  background: var(--green-bg); border: 1px solid var(--green-border);
  border-radius: 5px; color: var(--green); cursor: pointer; transition: all 0.15s;
}
.modal-save:hover { background: var(--green); color: var(--bg); }
.modal-cancel {
  font-size: 12px; font-family: var(--mono); padding: 6px 14px;
  background: none; border: 1px solid var(--border);
  border-radius: 5px; color: var(--text3); cursor: pointer; transition: all 0.15s;
}
.modal-cancel:hover { border-color: var(--border2); color: var(--text2); }
.modal-hint { margin-left: auto; font-size: 11px; color: var(--text3); font-family: var(--mono); }

/* Custom card — delete button */
.del-card-btn {
  font-size: 11px; font-family: var(--mono); padding: 3px 10px;
  background: none; border: 1px solid var(--border);
  border-radius: 4px; color: var(--text3); cursor: pointer; transition: all 0.15s;
}
.del-card-btn:hover { border-color: var(--red); color: var(--red); }

/* CREATE GROUP MODAL additions */
.icon-picker { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.icon-btn {
  font-size: 18px; width: 36px; height: 36px;
  border-radius: 6px; border: 2px solid transparent;
  background: var(--bg3); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.1s;
}
.icon-btn:hover { border-color: var(--border2); background: var(--bg4); }
.icon-btn.sel-icon { border-color: var(--blue); background: var(--blue-bg); }
.color-picker { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.color-swatch {
  width: 28px; height: 28px; border-radius: 6px;
  border: 2px solid transparent; cursor: pointer; transition: all 0.1s;
}
.color-swatch:hover, .color-swatch.sel-color { border-color: var(--text); transform: scale(1.15); }
.group-del-btn {
  font-size: 11px; font-family: var(--mono); padding: 3px 10px;
  background: none; border: 1px solid var(--border);
  border-radius: 4px; color: var(--text3); cursor: pointer; transition: all 0.15s;
}
.group-del-btn:hover { border-color: var(--red); color: var(--red); }
.nav-manage-groups {
  display: flex; align-items: center; gap: 6px; padding: 6px 12px;
  font-size: 11px; font-family: var(--mono); color: var(--text3); cursor: pointer;
  border-top: 1px solid var(--border); margin-top: 8px; transition: color 0.15s;
}
.nav-manage-groups:hover { color: var(--green); }

.icon-picker { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
.icon-btn { font-size:18px; width:36px; height:36px; border-radius:6px; border:2px solid transparent; background:var(--bg3); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.1s; }
.icon-btn:hover { border-color:var(--border2); background:var(--bg4); }
.icon-btn.sel-icon { border-color:var(--blue); background:var(--blue-bg); }
.color-picker { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
.color-swatch { width:28px; height:28px; border-radius:6px; border:2px solid transparent; cursor:pointer; transition:all 0.1s; }
.color-swatch:hover, .color-swatch.sel-color { border-color:var(--text); transform:scale(1.15); }
.group-del-btn { font-size:11px; font-family:var(--mono); padding:3px 10px; background:none; border:1px solid var(--border); border-radius:4px; color:var(--text3); cursor:pointer; transition:all 0.15s; }
.group-del-btn:hover { border-color:var(--red); color:var(--red); }
.nav-manage-groups { display:flex; align-items:center; gap:6px; padding:6px 12px; font-size:11px; font-family:var(--mono); color:var(--text3); cursor:pointer; border-top:1px solid var(--border); margin-top:8px; transition:color 0.15s; }
.nav-manage-groups:hover { color:var(--green); }
.export-btn {
  font-size:12px; font-family:var(--mono); padding:4px 12px;
  background:var(--bg3); border:1px solid var(--border);
  border-radius:5px; color:var(--text2); cursor:pointer; transition:all 0.15s;
  margin-left:6px;
}
.export-btn:hover { border-color:var(--blue); color:var(--blue); }
.import-btn {
  font-size:12px; font-family:var(--mono); padding:4px 12px;
  background:var(--bg3); border:1px solid var(--border);
  border-radius:5px; color:var(--text2); cursor:pointer; transition:all 0.15s;

  margin-left:6px;
}
.save-file-btn:hover { background:var(--blue); color:var(--bg); }
#modal-reset-btn { font-size:12px; font-family:var(--mono); padding:6px 14px; background:none; border:1px solid var(--border); border-radius:5px; color:var(--orange); cursor:pointer; transition:all 0.15s; }
#modal-reset-btn:hover { border-color:var(--orange); background:var(--orange-bg); }

</style>
</head>

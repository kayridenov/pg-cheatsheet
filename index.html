// ── Core helpers ──────────────────────────────────────────────────────────────
function escHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function syntaxHL(sql){
  const kw = /\b(SELECT|FROM|WHERE|JOIN|LEFT|RIGHT|INNER|OUTER|ON|AND|OR|NOT|IN|IS|NULL|ORDER|BY|GROUP|HAVING|LIMIT|OFFSET|WITH|AS|CASE|WHEN|THEN|ELSE|END|UNION|ALL|DISTINCT|INSERT|UPDATE|DELETE|CREATE|DROP|ALTER|TABLE|INDEX|VIEW|SET|VALUES|INTO|TRUNCATE|VACUUM|ANALYZE|EXPLAIN|BEGIN|COMMIT|ROLLBACK|COALESCE|NULLIF|ROUND|COUNT|SUM|AVG|MIN|MAX|NOW|EXTRACT|SPLIT_PART|ARRAY_TO_STRING|FORMAT|EXECUTE|FOR|LOOP|DECLARE|DO|RETURN|PERFORM|RAISE)\b/g;
  const fn = /\b(pg_stat_activity|pg_stat_replication|pg_stat_statements|pg_stat_user_tables|pg_stat_user_indexes|pg_stat_progress_vacuum|pg_stat_progress_analyze|pg_stat_progress_create_index|pg_stat_progress_cluster|pg_stat_progress_basebackup|pg_stat_progress_copy|pg_database|pg_class|pg_namespace|pg_index|pg_locks|pg_blocking_pids|pg_cancel_backend|pg_terminate_backend|pg_reload_conf|pg_stat_reset|pg_stat_statements_reset|pg_size_pretty|pg_database_size|pg_table_size|pg_indexes_size|pg_total_relation_size|pg_relation_size|pg_is_in_recovery|pg_last_wal_receive_lsn|pg_last_wal_replay_lsn|pg_last_xact_replay_timestamp|pg_wal_lsn_diff|pg_postmaster_start_time|pg_backend_pid|age)\b/gi;
  const str = /('[^']*')/g;
  const num = /\b(\d+(\.\d+)?)\b/g;
  const cmt = /(--[^\n]*)/g;
  return escHtml(sql)
    .replace(cmt, '<span class="c">$1</span>')
    .replace(kw, m => `<span class="k">${m}</span>`)
    .replace(fn, m => `<span class="f">${m}</span>`)
    .replace(str, '<span class="s">$1</span>')
    .replace(num, '<span class="s">$1</span>');
}

// ── localStorage: SQL edits ───────────────────────────────────────────────────
const LS_PREFIX = 'pgcs_sql_';
function savedSql(id){ try{ return localStorage.getItem(LS_PREFIX+id); }catch(e){ return null; } }
function saveSql(id,sql){ try{ localStorage.setItem(LS_PREFIX+id,sql); }catch(e){} }
function resetSql(id){ try{ localStorage.removeItem(LS_PREFIX+id); }catch(e){} }
function getEffectiveSql(item){ return savedSql(item.id)||item.sql; }
function isModified(id){ return savedSql(id)!==null; }

// ── renderCard (built-in) ─────────────────────────────────────────────────────
function renderCard(item){
  const modified = isModified(item.id);
  const effectiveSql = getEffectiveSql(item);
  const badgeMap = {os:"ОС",repl:"Репликация",perf:"Производительность",lock:"Блокировки",vac:"VACUUM"};
  const badge = item.badge ? `<span class="badge b-${item.badge}">${badgeMap[item.badge]}</span>` : '';
  const modDot = modified ? `<span class="modified-dot" title="Запрос изменён"></span>` : '';
  const cols = (item.cols||[]).map(c=>`
    <tr>
      <td class="col-n">${escHtml(c.n)}</td>
      <td class="col-d">${escHtml(c.d)}${c.note?`<span class="col-note">▸ ${escHtml(c.note)}</span>`:''}</td>
    </tr>`).join('');
  return `<div class="card" id="card-${item.id}">
    <div class="card-header" onclick="toggle('${item.id}')">
      <svg class="chevron" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="4,2 10,7 4,12"/></svg>
      <div class="card-meta">
        <div class="card-name">${escHtml(item.name)} ${badge}${modDot}</div>
        <div class="card-desc">${escHtml(item.desc)}</div>
      </div>
    </div>
    <div class="card-body">
      <div class="code-wrap">
        <pre id="pre-${item.id}">${syntaxHL(effectiveSql)}</pre>
        <div style="position:absolute;top:8px;right:8px;display:flex;gap:6px;">
          <button class="edit-btn${modified?' active':''}" id="editbtn-${item.id}"
            onclick="toggleEdit('${item.id}',event)">редактировать</button>
          <button class="copy-btn" id="copybtn-${item.id}"
            onclick="copyCode('${item.id}',event)">копировать</button>
        </div>
      </div>
      <div class="editor-wrap" id="editor-${item.id}">
        <div class="editor-toolbar">
          <span class="editor-label">✏ редактирование · сохраняется локально</span>
          <button class="editor-btn editor-save" onclick="saveEdit('${item.id}')">сохранить</button>
          <button class="editor-btn editor-reset" onclick="resetEdit('${item.id}')">сбросить</button>
          <button class="editor-btn editor-cancel" onclick="cancelEdit('${item.id}')">отмена</button>
        </div>
        <textarea class="sql-editor" id="ta-${item.id}" spellcheck="false" rows="12">${escHtml(effectiveSql)}</textarea>
      </div>
      ${cols?`<div class="cols-label">Пояснения по колонкам</div><table class="cols-table"><tbody>${cols}</tbody></table>`:''}
    </div>
  </div>`;
}

// ── Edit actions ──────────────────────────────────────────────────────────────
function findItem(id){ return DATA.find(d=>d.id===id) || loadCustomCards().find(d=>d.id===id); }

function toggleEdit(id, e){
  e.stopPropagation();
  const wrap = document.getElementById('editor-'+id);
  const btn  = document.getElementById('editbtn-'+id);
  const ta   = document.getElementById('ta-'+id);
  if(!wrap.classList.contains('visible')){
    const item = findItem(id);
    ta.value = getEffectiveSql(item);
    wrap.classList.add('visible');
    btn.classList.add('active');
    btn.textContent = 'закрыть';
    ta.focus();
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight+4,600)+'px';
  } else { cancelEdit(id); }
}

function saveEdit(id){
  const ta  = document.getElementById('ta-'+id);
  const sql = ta.value.trim();
  if(!sql) return;
  saveSql(id, sql);
  document.getElementById('pre-'+id).innerHTML = syntaxHL(sql);
  const card = document.getElementById('card-'+id);
  if(!card.querySelector('.modified-dot')){
    const dot = document.createElement('span');
    dot.className = 'modified-dot'; dot.title = 'Запрос изменён';
    card.querySelector('.card-name').appendChild(dot);
  }
  const btn = document.getElementById('editbtn-'+id);
  btn.classList.add('active');
  document.getElementById('editor-'+id).classList.remove('visible');
  btn.textContent = 'сохранено ✓';
  btn.style.borderColor = 'var(--green)'; btn.style.color = 'var(--green)';
  setTimeout(()=>{ btn.textContent='редактировать'; btn.style.borderColor=''; btn.style.color=''; }, 1800);
}

function resetEdit(id){
  if(!confirm('Вернуть оригинальный запрос?')) return;
  resetSql(id);
  const item = findItem(id);
  document.getElementById('pre-'+id).innerHTML = syntaxHL(item.sql);
  document.getElementById('ta-'+id).value = item.sql;
  const card = document.getElementById('card-'+id);
  const dot = card.querySelector('.modified-dot');
  if(dot) dot.remove();
  const btn = document.getElementById('editbtn-'+id);
  btn.classList.remove('active');
  btn.textContent = 'редактировать';
  document.getElementById('editor-'+id).classList.remove('visible');
}

function cancelEdit(id){
  document.getElementById('editor-'+id).classList.remove('visible');
  const btn = document.getElementById('editbtn-'+id);
  if(!isModified(id)) btn.classList.remove('active');
  btn.textContent = 'редактировать';
}

// ── Copy ──────────────────────────────────────────────────────────────────────
function copyCode(id, e){
  e.stopPropagation();
  const allCards = [...DATA, ...loadCustomCards()];
  const item = allCards.find(d=>d.id===id);
  const sql = getEffectiveSql(item);
  navigator.clipboard.writeText(sql).catch(()=>{
    const ta = document.createElement('textarea');
    ta.value = sql; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
  });
  const btn = document.getElementById('copybtn-'+id);
  btn.textContent = 'скопировано ✓'; btn.classList.add('copied');
  setTimeout(()=>{ btn.textContent='копировать'; btn.classList.remove('copied'); }, 1800);
}

function toggle(id){
  document.getElementById('card-'+id).classList.toggle('open');
}

function navClick(id){
  const el = document.getElementById('card-'+id);
  if(el){
    el.scrollIntoView({behavior:'smooth',block:'start'});
    if(!el.classList.contains('open')) toggle(id);
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    event.currentTarget.classList.add('active');
  }
}

// ── Custom cards (localStorage) ───────────────────────────────────────────────
const LS_CUSTOM = 'pgcs_custom_cards';

function loadCustomCards() {
  try { return JSON.parse(localStorage.getItem(LS_CUSTOM) || '[]'); }
  catch(e) { return []; }
}
function saveCustomCards(arr) {
  try { localStorage.setItem(LS_CUSTOM, JSON.stringify(arr)); } catch(e) {}
}
function getCustomCards() { return loadCustomCards(); }

// Inject custom cards into DATA dynamically
function buildDataWithCustom() {
  const custom = loadCustomCards();
  if (!custom.length) return DATA;
  // Group custom cards by section
  const bySec = {};
  custom.forEach(c => {
    if (!bySec[c.section]) bySec[c.section] = [];
    bySec[c.section].push(c);
  });
  // Build merged array: after each matching section insert custom cards
  const merged = [];
  const sections = DATA.filter(d => d.section).map(d => d.section);
  let i = 0;
  while (i < DATA.length) {
    const item = DATA[i];
    merged.push(item);
    if (item.section && bySec[item.section]) {
      // Find end of this section
      let j = i + 1;
      while (j < DATA.length && !DATA[j].section) j++;
      // Insert custom cards at end of section (before next section)
      bySec[item.section].forEach(c => merged.splice(j + merged.length - DATA.length - 1 + bySec[item.section].indexOf(c), 0, c));
      // Actually simpler: collect all items of this section, append custom at end
    }
    i++;
  }
  return merged;
}

// Simpler approach: append custom cards to their section inline during render
function getCustomForSection(sectionName) {
  return loadCustomCards().filter(c => c.section === sectionName);
}

// ── Modal state ───────────────────────────────────────────────────────────────
let editingCardId = null;
let colCount = 1;
let selectedSection = null;

// Extract sections from DATA + custom sections
function getCustomSections() {
  try { return JSON.parse(localStorage.getItem('pgcs_custom_sections') || '[]'); } catch(e) { return []; }
}
function saveCustomSections(arr) {
  try { localStorage.setItem('pgcs_custom_sections', JSON.stringify(arr)); } catch(e) {}
}
function getSections() {
  const built = DATA.filter(d => d.section);
  const custom = getCustomSections().map(s => ({section: s.name, icon: s.icon, color: s.color, dot: s.dot, custom: true}));
  return [...built, ...custom];
}

function openAddModal(editId) {
  editingCardId = editId || null;
  colCount = 1;
  selectedSection = null;

  // Build section chips — NO inline onclick to avoid quoting issues
  const chipsEl = document.getElementById('section-chips');
  chipsEl.innerHTML = getSections().map(s => {
    const chipId = 'chip-' + s.section.replace(/\s+/g, '-').replace(/[^a-zA-Z0-9-]/g, '');
    return `<div class="s-chip" id="${chipId}"
      data-section="${s.section.replace(/"/g,'&quot;')}"
      data-dot="${s.dot}"
      data-color="${s.color}">
      <span class="s-chip-dot" style="background:${s.dot}"></span>
      ${s.section}
    </div>`;
  }).join('');

  // Attach click handlers after rendering
  chipsEl.querySelectorAll('.s-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      selectedSection = chip.dataset.section;
      chipsEl.querySelectorAll('.s-chip').forEach(c => {
        c.classList.remove('sel');
        c.style.borderColor = '';
        c.style.background = 'var(--bg3)';
      });
      chip.classList.add('sel');
      chip.style.borderColor = chip.dataset.dot;
      chip.style.background = chip.dataset.color;
    });
  });

  // Reset cols editor
  const ce = document.getElementById('cols-editor');
  ce.innerHTML = `<div class="col-edit-row" id="col-row-0">
    <input placeholder="имя_колонки" />
    <textarea placeholder="Что означает эта колонка..." rows="2"></textarea>
    <button class="col-del" onclick="delCol(0)">✕</button>
  </div>`;
  colCount = 1;

  if (editId) {
    const cards = loadCustomCards();
    const card = cards.find(c => c.id === editId);
    if (card) {
      document.getElementById('modal-title').textContent = '✏ Редактировать запрос';
      document.getElementById('modal-save-btn').textContent = 'Обновить';
      document.getElementById('m-name').value = card.name;
      document.getElementById('m-desc').value = card.desc || '';
      document.getElementById('m-sql').value = card.sql;
      // Auto-select section chip
      const chipEl = chipsEl.querySelector(`[data-section="${card.section.replace(/"/g,'&quot;')}"]`);
      if (chipEl) chipEl.click();
      // Fill cols
      if (card.cols && card.cols.length) {
        ce.innerHTML = '';
        colCount = 0;
        card.cols.forEach(col => addColWithValues(col.n || '', col.d || ''));
      }
    }
  } else {
    document.getElementById('modal-title').textContent = '+ Новый запрос';
    document.getElementById('modal-save-btn').textContent = 'Сохранить';
    document.getElementById('m-name').value = '';
    document.getElementById('m-desc').value = '';
    document.getElementById('m-sql').value = '';
  }

  document.getElementById('modal-overlay').classList.add('visible');
  setTimeout(() => document.getElementById('m-name').focus(), 80);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('visible');
  editingCardId = null;
}

function overlayClick(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

function selectSection(name, el) {
  selectedSection = name;
  document.querySelectorAll('.s-chip').forEach(c => {
    c.classList.remove('sel');
    c.style.borderColor = '';
    c.style.background = 'var(--bg3)';
  });
  const dot = el.dataset.dot;
  const col = el.dataset.color;
  el.classList.add('sel');
  el.style.borderColor = dot;
  el.style.background = col;
}

// ── Columns editor ────────────────────────────────────────────────────────────
function addCol() { addColWithValues('', ''); }

function addColWithValues(name, desc) {
  const ce = document.getElementById('cols-editor');
  const id = colCount++;
  const row = document.createElement('div');
  row.className = 'col-edit-row';
  row.id = 'col-row-' + id;
  row.innerHTML = `
    <input placeholder="имя_колонки" value="${escHtml(name)}" />
    <textarea placeholder="Что означает эта колонка..." rows="2">${escHtml(desc)}</textarea>
    <button class="col-del" onclick="delCol(${id})">✕</button>`;
  ce.appendChild(row);
}

function delCol(id) {
  const row = document.getElementById('col-row-' + id);
  if (row) row.remove();
}

function readCols() {
  const rows = document.querySelectorAll('#cols-editor .col-edit-row');
  const cols = [];
  rows.forEach(row => {
    const inp = row.querySelector('input');
    const ta  = row.querySelector('textarea');
    const n = (inp ? inp.value.trim() : '');
    const d = (ta  ? ta.value.trim()  : '');
    if (n || d) cols.push({n, d});
  });
  return cols;
}

// ── Save card ─────────────────────────────────────────────────────────────────
function saveCard() {
  const name = document.getElementById('m-name').value.trim();
  const desc = document.getElementById('m-desc').value.trim();
  const sql  = document.getElementById('m-sql').value.trim();

  if (!selectedSection) { alert('Выбери раздел'); return; }
  if (!name) { alert('Введи название'); document.getElementById('m-name').focus(); return; }
  if (!sql)  { alert('Введи SQL запрос'); document.getElementById('m-sql').focus(); return; }

  const cols = readCols();
  const cards = loadCustomCards();

  if (editingCardId) {
    const idx = cards.findIndex(c => c.id === editingCardId);
    if (idx >= 0) {
      cards[idx] = { ...cards[idx], name, desc, sql, cols, section: selectedSection };
    }
  } else {
    const id = 'custom_' + Date.now();
    cards.push({ id, name, desc, sql, cols, section: selectedSection, custom: true });
  }

  saveCustomCards(cards);
  closeModal();
  render(document.getElementById('search').value);
  // Scroll to section
  setTimeout(() => {
    const secEl = document.getElementById('sec-' + selectedSection.replace(/\s+/g,'-'));
    if (secEl) secEl.scrollIntoView({behavior:'smooth', block:'start'});
  }, 100);
}

// ── Delete custom card ────────────────────────────────────────────────────────
function deleteCustomCard(id, e) {
  e.stopPropagation();
  if (!confirm('Удалить этот запрос?')) return;
  const cards = loadCustomCards().filter(c => c.id !== id);
  saveCustomCards(cards);
  // Also remove any saved SQL edits for this card
  resetSql(id);
  render(document.getElementById('search').value);
}

// ── Override render to include custom cards ───────────────────────────────────
// ── Render ────────────────────────────────────────────────────────────────────
function render(filter){
  const content = document.getElementById('content');
  const navLinks = document.getElementById('nav-links');
  const q = (filter||'').toLowerCase().trim();
  const customCards = loadCustomCards();

  let html = '';
  let sectionCount = 0;
  let cardCount = 0;
  let curSection = null;
  let curSectionCards = '';
  let curSectionCount = 0;

  function flushSection(){
    if(!curSection || curSectionCount === 0) return;
    sectionCount++;
    html += `<div class="section-header" id="sec-${curSection.id}">
      <div class="section-icon" style="background:${curSection.color}">${curSection.icon}</div>
      <div class="section-title-text">${curSection.name}</div>
      <div class="section-count">${curSectionCount} скриптов</div>
    </div>${curSectionCards}`;
  }

  // Merge DATA sections with custom sections for rendering
  const allSectionItems = [...DATA];
  // Append custom section markers and their cards
  getCustomSections().forEach(cs => {
    allSectionItems.push({section: cs.name, icon: cs.icon, color: cs.color, dot: cs.dot, custom: true});
  });

  allSectionItems.forEach(item=>{
    if(item.section){
      // Before flushing previous section, append its custom cards
      if (curSection) {
        const cc = customCards.filter(c => c.section === curSection.name);
        cc.forEach(c => {
          const hay = (c.name+c.desc+c.sql+(c.cols||[]).map(x=>x.n+x.d).join(' ')).toLowerCase();
          if (!q || hay.includes(q)) {
            curSectionCards += renderCustomCard(c);
            curSectionCount++;
            cardCount++;
          }
        });
      }
      flushSection();
      curSection = {name:item.section, icon:item.icon, color:item.color, dot:item.dot,
                    id:item.section.replace(/\s+/g,'-')};
      curSectionCards = '';
      curSectionCount = 0;
      return;
    }
    if(q){
      const hay = (item.name+item.desc+item.sql+(item.cols||[]).map(c=>c.n+c.d).join(' ')).toLowerCase();
      if(!hay.includes(q)) return;
    }
    curSectionCards += renderCard(item);
    curSectionCount++;
    cardCount++;
  });
  // Flush last section with its custom cards
  if (curSection) {
    const cc = customCards.filter(c => c.section === curSection.name);
    cc.forEach(c => {
      const hay = (c.name+c.desc+c.sql+(c.cols||[]).map(x=>x.n+x.d).join(' ')).toLowerCase();
      if (!q || hay.includes(q)) {
        curSectionCards += renderCustomCard(c);
        curSectionCount++;
        cardCount++;
      }
    });
  }
  flushSection();

  content.innerHTML = html || '<div class="empty">Ничего не найдено</div>';

  // Nav
  let nHtml = '';
  let nSection = null;
  [...DATA, ...getCustomSections().map(s=>({section:s.name,icon:s.icon,color:s.color,dot:s.dot,custom:true}))].forEach(item=>{
    if(item.section){
      nSection = item;
      nHtml += `<div class="nav-section">${item.custom?'<span style="color:var(--green);font-size:10px">★ </span>':''}${item.section}</div>`;
      // Add custom nav items for this section
      const cc = customCards.filter(c => c.section === item.section);
      cc.forEach(c => {
        if(q){
          const hay = (c.name+c.desc+c.sql+(c.cols||[]).map(x=>x.n+x.d).join(' ')).toLowerCase();
          if(!hay.includes(q)) return;
        }
        nHtml += `<a class="nav-item" href="#card-${c.id}" onclick="navClick('${c.id}')">
          <span class="nav-dot" style="background:${nSection.dot}"></span>
          <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--green)">${c.name}</span>
        </a>`;
      });
      return;
    }
    if(q){
      const hay = (item.name+item.desc+item.sql+(item.cols||[]).map(c=>c.n+c.d).join(' ')).toLowerCase();
      if(!hay.includes(q)) return;
    }
    const mod = isModified(item.id) ? ' style="color:var(--orange)"' : '';
    nHtml += `<a class="nav-item" href="#card-${item.id}" onclick="navClick('${item.id}')">
      <span class="nav-dot" style="background:${nSection?nSection.dot:'#8b949e'}"></span>
      <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"${mod}>${item.name}</span>
    </a>`;
  });
  navLinks.innerHTML = nHtml;

  document.getElementById('stat-visible').textContent = cardCount;
  document.getElementById('stat-sections').textContent = sectionCount;
}

// ── Render custom card ────────────────────────────────────────────────────────
function renderCustomCard(item) {
  const effectiveSql = getEffectiveSql(item);
  const cols = (item.cols||[]).filter(c=>c.n||c.d).map(c=>`
    <tr>
      <td class="col-n">${escHtml(c.n)}</td>
      <td class="col-d">${escHtml(c.d)}</td>
    </tr>`).join('');

  return `<div class="card" id="card-${item.id}" style="border-color:var(--green-border)">
    <div class="card-header" onclick="toggle('${item.id}')">
      <svg class="chevron" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5">
        <polyline points="4,2 10,7 4,12"/>
      </svg>
      <div class="card-meta">
        <div class="card-name">
          ${escHtml(item.name)}
          <span style="font-size:10px;padding:1px 7px;border-radius:10px;background:var(--green-bg);color:var(--green);border:1px solid var(--green-border);font-family:var(--mono)">мой</span>
        </div>
        <div class="card-desc">${escHtml(item.desc||'')}</div>
      </div>
    </div>
    <div class="card-body">
      <div class="code-wrap">
        <pre id="pre-${item.id}">${syntaxHL(effectiveSql)}</pre>
        <div style="position:absolute;top:8px;right:8px;display:flex;gap:6px;">
          <button class="edit-btn" onclick="openAddModal('${item.id}');event.stopPropagation()">редактировать</button>
          <button class="copy-btn" id="copybtn-${item.id}" onclick="copyCode('${item.id}',event)">копировать</button>
          <button class="del-card-btn" onclick="deleteCustomCard('${item.id}',event)">удалить</button>
        </div>
      </div>
      <div class="editor-wrap" id="editor-${item.id}">
        <div class="editor-toolbar">
          <span class="editor-label">✏ редактирование</span>
          <button class="editor-btn editor-save" onclick="saveEdit('${item.id}')">сохранить</button>
          <button class="editor-btn editor-cancel" onclick="cancelEdit('${item.id}')">отмена</button>
        </div>
        <textarea class="sql-editor" id="ta-${item.id}" spellcheck="false" rows="12">${escHtml(effectiveSql)}</textarea>
      </div>
      ${cols?`<div class="cols-label">Пояснения по колонкам</div>
      <table class="cols-table"><tbody>${cols}</tbody></table>`:''}
    </div>
  </div>`;
}

// ── Custom Sections ───────────────────────────────────────────────────────────
const SECTION_ICONS = ['📊','🖥','⚡','🔄','🧹','⏳','💾','❤️','🐧','🔧','📋','🗄','🔍','⚙️','📝','🚀','🛡','📈','🔗','💡'];
const SECTION_COLORS = [
  {bg:'#1f4068',dot:'#58a6ff'},{bg:'#2d1a00',dot:'#d29922'},{bg:'#0d2117',dot:'#3fb950'},
  {bg:'#1a0d2e',dot:'#bc8cff'},{bg:'#2a0d0d',dot:'#f85149'},{bg:'#0d2236',dot:'#79c0ff'},
  {bg:'#1a1a0d',dot:'#e3b341'},{bg:'#1f2a0d',dot:'#56d364'},{bg:'#0d1a1a',dot:'#39d3bb'},
  {bg:'#1a0d1a',dot:'#f778ba'},{bg:'#1a1a1a',dot:'#8b949e'},{bg:'#0d1a0d',dot:'#aff5b4'},
,

// ══════════════════════════════════════════════════════════
// БЫСТРАЯ ДИАГНОСТИКА (TOP-N)
// ══════════════════════════════════════════════════════════
{section:"Быстрая диагностика", icon:"🔬", color:"#1a0d1a", dot:"#f778ba"},

{id:"top5_active", name:"Топ-5 самых долгих активных запросов", badge:"lock",
desc:"Первое что смотреть при жалобах на тормоза — какие запросы прямо сейчас выполняются дольше всего.",
sql:`SELECT
  pid,
  usename,
  datname,
  client_addr,
  now() - query_start                                  AS duration,
  wait_event_type,
  wait_event,
  left(query, 120)                                     AS query
FROM pg_stat_activity
WHERE state = 'active'
  AND pid <> pg_backend_pid()
ORDER BY query_start ASC
LIMIT 5;`,
cols:[
  {n:"duration",d:"Время выполнения текущего запроса. Если растёт — запрос завис или ждёт."},
  {n:"wait_event_type / wait_event",d:"Если Lock — ждёт блокировку. Если IO — ждёт диск. Если null — реально работает на CPU.",
   note:"Для детального анализа: EXPLAIN (ANALYZE, BUFFERS) <query>;"}
]},

{id:"top5_idle_txn", name:"Топ-5 самых старых idle in transaction", badge:"lock",
desc:"Транзакции открытые но без активного запроса — удерживают локи и мешают VACUUM.",
sql:`SELECT
  pid,
  usename,
  datname,
  client_addr,
  now() - xact_start                                   AS xact_age,
  now() - state_change                                 AS idle_since,
  left(query, 120)                                     AS last_query
FROM pg_stat_activity
WHERE state = 'idle in transaction'
ORDER BY xact_start ASC NULLS LAST
LIMIT 5;`,
cols:[
  {n:"xact_age",d:"Возраст транзакции с момента BEGIN. Именно это время она держит локи."},
  {n:"idle_since",d:"Как давно последний запрос в транзакции завершился.",
   note:"Завершить: SELECT pg_terminate_backend(pid);"}
]},

{id:"top5_waiting", name:"Топ-5 запросов в ожидании блокировки", badge:"lock",
desc:"Запросы которые прямо сейчас ждут снятия чужой блокировки.",
sql:`SELECT
  a.pid,
  a.usename,
  a.datname,
  now() - a.query_start                               AS waiting_duration,
  a.wait_event_type,
  a.wait_event,
  left(a.query, 100)                                  AS waiting_query,
  pg_blocking_pids(a.pid)                             AS blocked_by
FROM pg_stat_activity a
WHERE a.wait_event_type = 'Lock'
  AND a.state = 'active'
  AND a.pid <> pg_backend_pid()
ORDER BY a.query_start ASC
LIMIT 5;`,
cols:[
  {n:"waiting_duration",d:"Как долго запрос ждёт блокировку."},
  {n:"wait_event",d:"relation = ждёт таблицу; tuple = ждёт строку; transactionid = ждёт завершения транзакции."},
  {n:"blocked_by",d:"PID(ы) процессов-виновников.",
   note:"SELECT pg_terminate_backend(<pid из blocked_by>); — разблокирует жертву."}
]},

{id:"top5_long_xact", name:"Топ-5 самых старых транзакций (любое состояние)", badge:"",
desc:"Старейшие транзакции на сервере — мешают VACUUM, накапливают bloat, удерживают XID.",
sql:`SELECT
  pid,
  usename,
  datname,
  client_addr,
  state,
  now() - xact_start                                  AS xact_age,
  now() - query_start                                  AS query_age,
  left(query, 100)                                     AS query
FROM pg_stat_activity
WHERE xact_start IS NOT NULL
  AND pid <> pg_backend_pid()
ORDER BY xact_start ASC
LIMIT 5;`,
cols:[
  {n:"xact_age",d:"Полное время жизни транзакции. Старые транзакции — главная причина bloat и проблем с VACUUM."},
  {n:"state",d:"active = выполняет запрос; idle in transaction = ждёт следующий запрос.",
   note:"Если xact_age > 1 часа — почти всегда проблема. Разберись и при необходимости завершай."}
]},

{id:"top5_temp_files", name:"Топ-5 запросов пишущих временные файлы", badge:"perf",
desc:"Запросы которым не хватило work_mem и они сбрасывают данные на диск. Медленно.",
sql:`SELECT
  pid,
  usename,
  datname,
  now() - query_start                                  AS duration,
  temp_files,
  pg_size_pretty(temp_bytes)                           AS temp_size,
  left(query, 100)                                     AS query
FROM pg_stat_activity
WHERE state = 'active'
  AND temp_files > 0
  AND pid <> pg_backend_pid()
ORDER BY temp_bytes DESC
LIMIT 5;`,
cols:[
  {n:"temp_files",d:"Количество временных файлов созданных этим запросом."},
  {n:"temp_size",d:"Суммарный размер временных файлов. Большой = work_mem сильно мал для этого запроса.",
   note:"Для конкретного запроса: SET work_mem = '256MB'; — временно увеличить только для сессии."}
]},

{id:"session_summary", name:"Сводка по всем сессиям прямо сейчас", badge:"",
desc:"Краткий дашборд состояния сервера: сколько сессий в каждом состоянии, блокировки, ожидания.",
sql:`SELECT
  state,
  count(*)                                             AS total,
  count(*) FILTER (WHERE wait_event_type = 'Lock')    AS lock_waits,
  count(*) FILTER (WHERE wait_event_type = 'IO')      AS io_waits,
  count(*) FILTER (WHERE wait_event_type = 'LWLock')  AS lwlock_waits,
  count(*) FILTER (WHERE now()-xact_start > '1 min')  AS long_xacts,
  count(*) FILTER (WHERE now()-xact_start > '5 min')  AS very_long_xacts,
  min(now() - xact_start)                             AS oldest_xact,
  max(now() - xact_start)                             AS newest_xact
FROM pg_stat_activity
WHERE pid <> pg_backend_pid()
  AND state IS NOT NULL
GROUP BY state
ORDER BY total DESC;`,
cols:[
  {n:"lock_waits / io_waits",d:"Сессии ждущие блокировки или диска — нормально иметь несколько, плохо когда много."},
  {n:"long_xacts / very_long_xacts",d:"Транзакции живущие > 1 и > 5 минут. > 0 в very_long = стоит разобраться."},
  {n:"oldest_xact",d:"Возраст самой старой транзакции. Если большой — проверь top5_long_xact."}
]},

{id:"connections_per_app", name:"Подключения по приложениям и состояниям", badge:"",
desc:"Кто подключён, сколько соединений от каждого приложения и в каком состоянии.",
sql:`SELECT
  application_name,
  usename,
  datname,
  state,
  count(*)                                             AS connections,
  count(*) FILTER (WHERE wait_event_type = 'Lock')    AS lock_waits,
  min(now() - backend_start)                          AS oldest_conn,
  max(now() - backend_start)                          AS newest_conn
FROM pg_stat_activity
WHERE pid <> pg_backend_pid()
  AND application_name IS NOT NULL
GROUP BY application_name, usename, datname, state
ORDER BY connections DESC
LIMIT 30;`,
cols:[
  {n:"application_name",d:"Имя приложения (передаётся клиентом). Пустое = приложение не установило имя."},
  {n:"oldest_conn",d:"Самое старое соединение от этого приложения — помогает найти утечки соединений.",
   note:"Установить имя: SET application_name = 'my_app'; или в connection string: application_name=my_app"}
]},

{id:"autovac_activity", name:"Текущая активность autovacuum", badge:"vac",
desc:"Что прямо сейчас делает autovacuum — на каких таблицах работает и сколько времени.",
sql:`SELECT
  pid,
  now() - xact_start                                  AS duration,
  CASE
    WHEN query ~ 'to prevent wraparound' THEN '⚠ WRAPAROUND'
    ELSE 'regular'
  END                                                  AS mode,
  left(query, 100)                                     AS query
FROM pg_stat_activity
WHERE query LIKE '%autovacuum%'
  AND state <> 'idle'
  AND pid <> pg_backend_pid()
ORDER BY xact_start ASC;`,
cols:[
  {n:"duration",d:"Как долго autovacuum работает на этой таблице."},
  {n:"mode",d:"WRAPAROUND = критично, не убивай! regular = плановая работа.",
   note:"Количество воркеров: autovacuum_max_workers (по умолчанию 3). Смотри pg_stat_progress_vacuum для деталей."}
]},

{id:"replication_lag_detail", name:"Подробный лаг репликации с мастера", badge:"repl",
desc:"Полная картина: байтовое отставание каждой реплики и время лага.",
sql:`SELECT
  client_addr,
  application_name,
  state,
  sync_state,
  pg_wal_lsn_diff(pg_current_wal_lsn(), sent_lsn)    AS send_lag_bytes,
  pg_wal_lsn_diff(sent_lsn, write_lsn)               AS write_lag_bytes,
  pg_wal_lsn_diff(write_lsn, flush_lsn)              AS flush_lag_bytes,
  pg_wal_lsn_diff(flush_lsn, replay_lsn)             AS replay_lag_bytes,
  pg_wal_lsn_diff(pg_current_wal_lsn(), replay_lsn)  AS total_lag_bytes,
  pg_size_pretty(
    pg_wal_lsn_diff(pg_current_wal_lsn(), replay_lsn)
  )                                                   AS total_lag_size,
  write_lag,
  flush_lag,
  replay_lag
FROM pg_stat_replication
ORDER BY total_lag_bytes DESC NULLS LAST;`,
cols:[
  {n:"send_lag_bytes",d:"Данные ещё не отправлены реплике (на мастере)."},
  {n:"write_lag_bytes",d:"Отправлены, но не записаны в WAL реплики."},
  {n:"flush_lag_bytes",d:"Записаны, но не сброшены на диск (fsync не сделан)."},
  {n:"replay_lag_bytes",d:"Сброшены на диск, но не применены к данным."},
  {n:"total_lag_size",d:"Полное байтовое отставание. > 100 MB = риск потери данных при failover.",
   note:"Если total_lag_bytes = 0 — реплика синхронна. replay_lag = NULL при streaming = тоже ОК."}
]},

{id:"kill_all_idle", name:"Шаблоны: завершить проблемные сессии", badge:"lock",
desc:"Готовые команды для разных ситуаций — завершить по состоянию, базе, пользователю, времени.",
sql:`-- Завершить конкретную сессию по PID:
SELECT pg_terminate_backend(12345);

-- Завершить все idle in transaction > 5 минут:
SELECT count(pg_terminate_backend(pid))
FROM pg_stat_activity
WHERE state = 'idle in transaction'
  AND now() - state_change > INTERVAL '5 minutes'
  AND pid <> pg_backend_pid();

-- Завершить все соединения к конкретной БД:
SELECT count(pg_terminate_backend(pid))
FROM pg_stat_activity
WHERE datname = 'mydb'
  AND pid <> pg_backend_pid();

-- Завершить все соединения конкретного пользователя:
SELECT count(pg_terminate_backend(pid))
FROM pg_stat_activity
WHERE usename = 'someuser'
  AND pid <> pg_backend_pid();

-- Мягко отменить только запрос (не убивать сессию):

-- Отменить все запросы дольше 10 минут:
SELECT count(pg_cancel_backend(pid))
FROM pg_stat_activity
WHERE state = 'active'

  AND pid <> pg_backend_pid();`,
cols:[
  {n:"pg_cancel_backend(pid)",d:"Посылает SIGINT — прерывает запрос, транзакция откатывается. Мягко."},
  {n:"pg_terminate_backend(pid)",d:"Посылает SIGTERM — убивает сессию полностью."},
  {n:"count(...)",d:"Возвращает количество успешно завершённых сессий.",
   note:"true = сигнал доставлен. false = процесс уже завершился или нет прав."}
]}

];
let newGroupIcon = SECTION_ICONS[0];
let newGroupColor = SECTION_COLORS[0];

function openGroupModal() {
  newGroupIcon = SECTION_ICONS[0];
  newGroupColor = SECTION_COLORS[0];
  document.getElementById('gm-name').value = '';
  document.getElementById('gm-icon-picker').innerHTML = SECTION_ICONS.map(ic =>
    '<button class="icon-btn' + (ic===newGroupIcon?' sel-icon':'') + '" onclick="selectGroupIcon(\'' + ic + '\',this)">' + ic + '</button>'
  ).join('');
  document.getElementById('gm-color-picker').innerHTML = SECTION_COLORS.map((c,i) =>
    '<div class="color-swatch' + (i===0?' sel-color':'') + '" style="background:' + c.dot + '" onclick="selectGroupColor(' + i + ',this)" title="' + c.dot + '"></div>'
  ).join('');
  renderGroupsList();
  document.getElementById('group-modal-overlay').classList.add('visible');
  setTimeout(() => document.getElementById('gm-name').focus(), 80);
}

function closeGroupModal() {
  document.getElementById('group-modal-overlay').classList.remove('visible');
}

function selectGroupIcon(icon, el) {
  newGroupIcon = icon;
  document.querySelectorAll('.icon-btn').forEach(b => b.classList.remove('sel-icon'));
  el.classList.add('sel-icon');
}

function selectGroupColor(idx, el) {
  newGroupColor = SECTION_COLORS[idx];
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('sel-color'));
  el.classList.add('sel-color');
}

function saveGroup() {
  const name = document.getElementById('gm-name').value.trim();
  if (!name) { alert('Введи название группы'); document.getElementById('gm-name').focus(); return; }
  const all = [...DATA.filter(d=>d.section).map(d=>d.section), ...getCustomSections().map(s=>s.name)];
  if (all.includes(name)) { alert('Группа с таким именем уже существует'); return; }
  const groups = getCustomSections();
  groups.push({ name, icon: newGroupIcon, color: newGroupColor.bg, dot: newGroupColor.dot });
  saveCustomSections(groups);
  document.getElementById('gm-name').value = '';
  renderGroupsList();
  render(document.getElementById('search').value);
}

function deleteGroup(name) {
  const cards = loadCustomCards().filter(c => c.section === name);
  if (cards.length > 0) {
    if (!confirm('В группе "' + name + '" есть ' + cards.length + ' запрос(ов). Удалить всё?')) return;
    saveCustomCards(loadCustomCards().filter(c => c.section !== name));
  }
  saveCustomSections(getCustomSections().filter(g => g.name !== name));
  renderGroupsList();
  render(document.getElementById('search').value);
}

function renderGroupsList() {
  const groups = getCustomSections();
  const el = document.getElementById('gm-existing');
  if (!groups.length) {
    el.innerHTML = '<div style="color:var(--text3);font-size:12px;padding:6px 0;">Нет пользовательских групп</div>';
    return;
  }
  el.innerHTML = groups.map(g => {
    const cnt = loadCustomCards().filter(c => c.section === g.name).length;
    return '<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border)">'
      + '<span style="font-size:16px">' + g.icon + '</span>'
      + '<span style="flex:1;font-size:12px;color:var(--text)">' + escHtml(g.name) + '</span>'
      + '<span style="font-size:11px;color:var(--text3)">' + cnt + ' запр.</span>'
      + '<button class="group-del-btn" onclick="deleteGroup(' + JSON.stringify(g.name) + ')">удалить</button>'
      + '</div>';
  }).join('');
}
